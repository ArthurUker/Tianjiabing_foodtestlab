# =========================================================
# 部署适配文件（Adapter）— 每个用户 / 每套系统一份
# =========================================================
# 用法：
#   1. 复制本文件为 deploy.<系统名>.conf
#   2. 按实际情况修改下面的值
#   3. 运行：sudo bash deploy.sh /path/to/deploy.<系统名>.conf
#
# 说明：deploy.sh 是“通用脚本”，只负责流程；本文件是“适配文件”，
#       只负责描述这一套环境长什么样。两者解耦，换用户/换系统只改本文件。
# =========================================================

# ===== 系统标识 =====
# 决定目录、服务名、系统用户名：/opt/<SYSTEM_NAME>、<SYSTEM_NAME>-api.service、用户 <SYSTEM_NAME>
SYSTEM_NAME="foodtestlab"

# ===== 代码来源 =====
REPO_URL="https://github.com/ArthurUker/Tianjiabing_foodtestlab.git"
DEPLOY_BRANCH="main"          # 本系统对应的 Git 分支（按你的实际情况改）
GIT_CLONE_DEPTH=1             # 浅克隆深度；改为 0 表示完整克隆

# ===== 目录布局（一般无需修改）=====
REPO_ROOT="/opt/${SYSTEM_NAME}"     # 代码克隆目录
DATA_DIR="/var/lib/${SYSTEM_NAME}"  # SQLite 数据库目录
LOG_DIR="/var/log/${SYSTEM_NAME}"   # 日志目录

# ===== 端口与服务名（多用户同机必须全服务器唯一）=====
API_PORT=3000                  # 后端内部端口（仅 127.0.0.1，Caddy 反代到此）
FRONTEND_PORT=8080             # 用户公网访问端口（Caddy 对外监听；安全组需放行；每用户不同）
APP_NAME="${SYSTEM_NAME}-api"  # systemd 服务名

# ===== 公网暴露（Caddy）=====
# DOMAIN 留空 = 仅 HTTP，监听 :80；填域名 = 自动申请 Let's Encrypt HTTPS
DOMAIN=""
TLS_EMAIL=""                   # DOMAIN 非空时必填（证书注册邮箱）

# ===== 数据库 =====
DB_TYPE="sqlite"               # 当前仅支持 sqlite
# DATABASE_URL 留空则由脚本按 DATA_DIR 自动拼接为 file:<DATA_DIR>/<SYSTEM_NAME>.db
DATABASE_URL=""

# ===== 跨域 / 站点来源 =====
# 浏览器访问站点的 Origin。无域名时填 http://<公网IP>；留空脚本自动推断（或回退为 *）
CORS_ORIGIN=""

# ===== 安全密钥 =====
# 全部留空 = 脚本自动生成强随机值并写入 backend/.env（推荐）
JWT_SECRET=""
SEED_ADMIN_PASSWORD=""
SEED_OPERATOR_PASSWORD=""
SEED_VIEWER_PASSWORD=""
JWT_EXPIRE="7d"

# ===== 运行时安装行为 =====
INSTALL_RUNTIME=true           # true = 脚本自动装 Node(NVM)/Caddy/Git
NODE_VERSION="20"              # 安装的 Node LTS 版本
ENABLE_SWAP=auto              # true=强制开 / false=不开 / auto=内存<2G 时自动开
SWAP_SIZE_GB=2                 # swap 大小（实际开启 swap 时生效）
SERVICE_MEMORY_MAX=""          # 后端内存上限(MB)；留空=按服务器内存自适应（见 README）
REQUIRED_MOUNT=""              # 数据盘挂载点；非空时未挂载则中止，避免数据静默写回系统盘

# ===== 数据库初始化行为 =====
ACCEPT_DATA_LOSS=true          # prisma db push 是否接受数据丢失
                               # 改为 false = 观察模式，遇破坏性 schema 变更即中止部署
SEED_ON_FIRST_DEPLOY=true      # 首次部署（库文件不存在）执行 seed 初始化账号

# ===== 前端构建 =====
FRONTEND_NPM_INSTALL=false     # build-static.js 仅用 Node 内置模块，无需 npm install；
                               # 若你改成其它需要依赖的构建方式，再改为 true
