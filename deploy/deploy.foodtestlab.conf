# =========================================================
# 适配文件（真实服务器参数）— 田家炳食品检验系统 / 腾讯云 CVM
# =========================================================
# 硬件：2 vCPU / 3.5GiB 内存 / Swap 0 / 系统盘 49G + 数据盘 /mnt/datadisk0 49G
# 网络：内网 eth0 172.17.0.9；公网 EIP 111.231.166.161（安全组须放行 80/443）
# 用法：sudo bash deploy.sh /opt/deploy/deploy.foodtestlab.conf
# =========================================================

# ===== 系统标识 =====
SYSTEM_NAME="foodtestlab"

# ===== 代码来源 =====
REPO_URL="https://github.com/ArthurUker/Tianjiabing_foodtestlab.git"
DEPLOY_BRANCH="main"
GIT_CLONE_DEPTH=1

# ===== 目录布局 =====
REPO_ROOT="/opt/${SYSTEM_NAME}"                 # 代码在系统盘（小、需频繁 pull/构建）
DATA_DIR="/mnt/datadisk0/${SYSTEM_NAME}/data"   # 数据库放独立数据盘（与系统盘生命周期解耦）
LOG_DIR="/mnt/datadisk0/${SYSTEM_NAME}/logs"    # 日志同样放数据盘

# ===== 端口与服务名（多用户同机必须全服务器唯一）=====
API_PORT=3000              # 后端内部端口（127.0.0.1，仅本机）
FRONTEND_PORT=8080         # 用户访问的前端端口（公网，需安全组放行；每台服务器内须唯一）
APP_NAME="${SYSTEM_NAME}-api"

# ===== 公网暴露（Caddy）=====
DOMAIN=""          # 多用户按端口区分；暂无域名则 Caddy 监听 :FRONTEND_PORT
TLS_EMAIL=""

# ===== 数据库（PostgreSQL，与后端 provider=postgresql 一致）=====
DB_TYPE="postgresql"
# 留空则由脚本自动生成强随机密码并拼出连接串：
#   postgresql://<PG_USER>:<密码>@<PG_HOST>:<PG_PORT>/<PG_DB_NAME>
DATABASE_URL=""
# 可选：显式指定 PostgreSQL 连接参数（默认本地单实例）
# PG_HOST="127.0.0.1"
# PG_PORT="5432"
# PG_DB_NAME="foodtestlab"
# PG_USER="foodtestlab"
# PG_PASSWORD=""   # 留空=脚本自动生成

# ===== 跨域 / 站点来源 =====
# 留空：脚本用 curl ifconfig.me 取到公网出口 IP（=111.231.166.161），生成 http://<IP>
CORS_ORIGIN=""

# ===== 安全密钥（留空=脚本自动生成强随机值）=====
JWT_SECRET=""
SEED_ADMIN_PASSWORD=""
SEED_OPERATOR_PASSWORD=""
SEED_VIEWER_PASSWORD=""
JWT_EXPIRE="7d"

# ===== 运行时安装行为 =====
INSTALL_RUNTIME=true
NODE_VERSION="20"
ENABLE_SWAP=true   # 3.5G 内存 + 0 swap，构建峰值需 swap 缓冲，避免 OOM Killer
SWAP_SIZE_GB=2

# ===== 数据盘前置检查 =====
# 非空：若 /mnt/datadisk0 未挂载，脚本直接中止（不静默写回系统盘）
REQUIRED_MOUNT="/mnt/datadisk0"

# ===== 数据库初始化行为 =====
ACCEPT_DATA_LOSS=true
SEED_ON_FIRST_DEPLOY=true

# ===== 多租户（方案② Schema-per-tenant）首次初始化 =====
# PROVISION_TENANTS=true 时，部署脚本会为每个学校代码：
#   ① 创建 schema `school_<code>`  ② 推送业务表  ③ 写 public 系统记录  ④ 建租户 admin
# dev/test 最简模式：SCHOOL_CODES 留空 => 脚本 [SKIP] 跳过多租户初始化，仅用 public 共享 schema。
#   后续要加学校，只需把 SCHOOL_CODES 填上代码（如 tianjiabing）并重跑部署即可。
PROVISION_TENANTS=true
SCHOOL_CODES=""
# SCHOOL_NAME_tianjiabing="田家炳食品检验实验室"

# ===== 前端构建 =====
FRONTEND_NPM_INSTALL=false
