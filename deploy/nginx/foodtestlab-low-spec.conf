# Tencent Cloud low-spec deployment template
# - Nginx serves static frontend files
# - Node only serves /api
# - Static caching enabled
# - API reverse proxy and CORS handled centrally

# Put this file into /etc/nginx/conf.d/foodtestlab.conf

map $http_origin $cors_allow_origin {
    default "";
    "http://159.75.106.179:8081" $http_origin;
    "http://localhost:5173" $http_origin;
}

server {
    # Use a dedicated frontend port when there is no private domain.
    # Keep existing system on 8080 and expose this system on 8081.
    listen 8081;
    server_name 159.75.106.179;

    # Path to static frontend assets (upload your index.html/js/css here)
    root /var/www/foodtestlab;
    index index.html;

    # -------- Frontend static hosting --------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long cache for versioned assets
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|webp|woff|woff2|ttf)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # HTML should not be strongly cached
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # -------- API reverse proxy --------
    # Your Node API process should listen at 127.0.0.1:3001
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # CORS allowlist
        if ($cors_allow_origin != "") {
            add_header Access-Control-Allow-Origin $cors_allow_origin always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Allow-Methods "GET,POST,PUT,PATCH,DELETE,OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization,Content-Type" always;
        }

        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # Optional API health pass-through
    location = /health {
        proxy_pass http://127.0.0.1:3001/health;
    }

    # Basic gzip for low bandwidth servers
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml+rss application/xml;
    gzip_min_length 1024;
}
