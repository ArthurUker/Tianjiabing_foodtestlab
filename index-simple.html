<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>食品安全检验管理系统 (Pro) - 简化版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body class="bg-gray-50">
    <div class="bg-blue-600 text-white p-4 shadow-lg">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <i class="fas fa-shield-alt text-2xl"></i>
                <h1 class="text-xl font-bold">田家炳中学食品安全检验管理系统</h1>
            </div>
            <div class="text-sm"><i class="far fa-user mr-2"></i>李丹 (管理员)</div>
        </div>
    </div>

    <div class="max-w-6xl mx-auto p-4">
        <div class="bg-yellow-100 border-2 border-yellow-400 text-yellow-800 p-4 rounded-lg mb-4">
            <i class="fas fa-exclamation-triangle mr-2"></i>
            <strong>诊断信息:</strong> 如果您看到这个消息，说明 HTML 加载成功，但 JavaScript 出现了问题。
        </div>

        <div class="bg-white rounded-lg shadow p-6">
            <h2 class="text-2xl font-bold mb-4">📋 故障排查步骤:</h2>
            <ol class="list-decimal list-inside space-y-3 text-lg">
                <li>打开浏览器开发者工具 (按 <kbd class="bg-gray-200 px-2 py-1">F12</kbd>)</li>
                <li>切换到 <strong>Console</strong> 标签</li>
                <li>查找所有的 <span class="text-red-600">❌ 红色错误</span> 消息</li>
                <li>将错误信息复制后告诉开发者</li>
            </ol>
        </div>

        <div class="bg-blue-50 border-l-4 border-blue-500 p-4 rounded mt-4">
            <p class="text-sm">💡 <strong>提示:</strong> 您可以在 Console 中执行 <code class="bg-gray-200 px-2 py-1">location.reload(true)</code> 来强制刷新并清除缓存。</p>
        </div>
    </div>

    <script>
        console.log('✅ 页面 HTML 已加载');
        console.log('📍 下面将开始加载 JavaScript 模块...');
    </script>
    <script type="module">
        console.log('📍 module 脚本开始执行');
        
        try {
            console.log('📦 正在导入 main.js...');
            await import('./js/main.js');
            console.log('✅ main.js 导入成功');
        } catch (error) {
            console.error('❌ main.js 导入失败:');
            console.error('错误信息:', error.message);
            console.error('Stack:', error.stack);
            
            // 显示错误信息到页面
            const errorDiv = document.createElement('div');
            errorDiv.className = 'fixed top-4 right-4 bg-red-600 text-white p-6 rounded-lg shadow-xl max-w-md z-50';
            errorDiv.innerHTML = `
                <h3 class="font-bold mb-2">❌ JavaScript 加载错误</h3>
                <p class="text-sm mb-2"><strong>错误:</strong> ${error.message}</p>
                <p class="text-xs bg-red-700 p-2 rounded overflow-auto max-h-40">
                    <code>${error.stack}</code>
                </p>
                <p class="text-xs mt-2">请查看 Console 了解更多信息</p>
            `;
            document.body.appendChild(errorDiv);
        }
    </script>
</body>
</html>
