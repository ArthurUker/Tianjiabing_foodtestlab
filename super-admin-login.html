<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>平台超级管理员登录</title>
    <link rel="stylesheet" href="./css/tailwind.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <script src="./js/utils/themePresets.js"></script>
    <style>
        body { background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%); }
        .login-card { animation: slideIn 0.5s ease-out; }
        @keyframes slideIn { from { opacity:0; transform: translateY(20px);} to {opacity:1; transform: translateY(0);} }
        .input-focus { transition: all 0.3s ease; }
        .input-focus:focus { border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99,102,241,0.2); }
        .btn-loading { pointer-events: none; }
        .error-shake { animation: shake 0.3s ease-in-out; }
        @keyframes shake { 0%,100%{transform:translateX(0);} 25%{transform:translateX(-5px);} 75%{transform:translateX(5px);} }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 text-gray-800">
    <div class="login-card w-full max-w-md">
        <div class="bg-white/95 backdrop-blur rounded-2xl shadow-2xl p-8">
            <!-- 标题 -->
            <div class="text-center mb-8">
                <div class="mb-4 inline-flex items-center justify-center w-16 h-16 rounded-full bg-indigo-50">
                    <i class="fas fa-user-shield text-3xl text-indigo-600"></i>
                </div>
                <h1 class="text-2xl font-bold text-gray-800 mb-1">平台超级管理员</h1>
                <p class="text-gray-500 text-sm">学校管理控制台 · 独立登录入口</p>
            </div>

            <!-- 登录表单 -->
            <form id="saLoginForm" class="space-y-5">
                <div>
                    <label for="username" class="block text-sm font-medium text-gray-700 mb-2">
                        <i class="fas fa-user mr-2 text-indigo-600"></i>管理员账号
                    </label>
                    <input type="text" id="username" name="username" autocomplete="username"
                        class="input-focus w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
                        placeholder="请输入平台超管用户名" required>
                </div>

                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-2">
                        <i class="fas fa-lock mr-2 text-indigo-600"></i>密码
                    </label>
                    <div class="relative">
                        <input type="password" id="password" name="password" autocomplete="current-password"
                            class="input-focus w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
                            placeholder="请输入密码" required>
                        <button type="button" id="togglePassword" tabindex="-1"
                            class="absolute right-3 top-2.5 text-gray-500 hover:text-gray-700">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <!-- 错误提示 -->
                <div id="errorMessage" class="hidden p-3 bg-red-100 border border-red-400 text-red-700 rounded-lg text-sm flex items-center">
                    <i class="fas fa-exclamation-circle mr-2"></i>
                    <span id="errorText"></span>
                </div>

                <!-- 登录按钮 -->
                <button type="submit" id="loginBtn"
                    class="w-full bg-gradient-to-r from-indigo-600 to-indigo-700 hover:from-indigo-700 hover:to-indigo-800 text-white font-semibold py-2.5 rounded-lg transition duration-300 shadow-lg hover:shadow-xl flex items-center justify-center">
                    <i class="fas fa-sign-in-alt mr-2"></i>
                    <span id="loginBtnText">登 录</span>
                </button>
            </form>

            <!-- 分隔线 -->
            <div class="flex items-center my-6">
                <div class="flex-1 h-px bg-gray-200"></div>
                <span class="px-3 text-xs text-gray-400">普通用户请从此处进入</span>
                <div class="flex-1 h-px bg-gray-200"></div>
            </div>

            <a href="./login.html" class="block text-center text-sm text-indigo-600 hover:text-indigo-800 font-medium">
                <i class="fas fa-arrow-left mr-1"></i>我是学校管理员 / 检测员 / 访客？前往普通登录
            </a>
        </div>

        <p class="text-center text-white/60 text-xs mt-6">食品安全检验管理系统 · 平台超管专用通道</p>
    </div>

    <script type="module">
        import { authService } from './js/services/AuthService.js';

        const form = document.getElementById('saLoginForm');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const loginBtn = document.getElementById('loginBtn');
        const loginBtnText = document.getElementById('loginBtnText');
        const errorMessage = document.getElementById('errorMessage');
        const errorText = document.getElementById('errorText');

        // 已登录则直接进入控制台
        if (authService.isAuthenticated()) {
            const u = authService.getUser();
            if (u && u.role === 'admin' && !u.schoolCode) {
                window.location.replace('./admin-schools.html');
            }
        }

        function showError(msg) {
            errorText.textContent = msg;
            errorMessage.classList.remove('hidden');
        }
        function hideError() {
            errorMessage.classList.add('hidden');
        }

        // 密码可见性切换
        document.getElementById('togglePassword').addEventListener('click', function () {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            this.innerHTML = type === 'password' ? '<i class="fas fa-eye"></i>' : '<i class="fas fa-eye-slash"></i>';
        });

        form.addEventListener('submit', async function (e) {
            e.preventDefault();
            hideError();

            const username = usernameInput.value.trim();
            const password = passwordInput.value.trim();

            if (!username || !password) {
                showError('用户名和密码不能为空');
                return;
            }

            loginBtn.disabled = true;
            loginBtn.classList.add('btn-loading', 'opacity-70');
            loginBtnText.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>登录中...';

            try {
                const result = await authService.loginSuperAdmin(username, password);
                if (result.success) {
                    loginBtnText.innerHTML = '<i class="fas fa-check mr-2"></i>登录成功';
                    setTimeout(() => window.location.replace('./admin-schools.html'), 80);
                } else {
                    showError(result.message || '登录失败，请检查账号或密码');
                    form.classList.add('error-shake');
                    setTimeout(() => form.classList.remove('error-shake'), 300);
                    passwordInput.value = '';
                }
            } catch (err) {
                showError('网络错误，请稍后重试');
            } finally {
                loginBtn.disabled = false;
                loginBtn.classList.remove('btn-loading', 'opacity-70');
                loginBtnText.textContent = '登 录';
            }
        });
    </script>
</body>
</html>
