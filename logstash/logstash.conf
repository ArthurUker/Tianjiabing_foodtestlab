# Logstash 配置文件
# 用于收集和处理应用日志

input {
  # 从 Docker 容器日志收集
  tcp {
    port => 5000
    codec => json
    type => "application-logs"
  }

  # 从应用直接读取日志
  file {
    path => "/app/logs/*.log"
    start_position => "beginning"
    codec => json
    type => "file-logs"
  }

  # Syslog 输入
  udp {
    port => 514
    codec => json
    type => "syslog-logs"
  }
}

filter {
  # 如果是 JSON 则解析
  if [type] == "application-logs" or [type] == "syslog-logs" {
    json {
      source => "message"
      target => "parsed_log"
    }
  }

  # 添加时间戳
  if [parsed_log][timestamp] {
    date {
      match => ["[parsed_log][timestamp]", "ISO8601"]
      target => "@timestamp"
    }
  }

  # 解析日志级别
  mutate {
    add_field => {
      "[@metadata][severity]" => "%{[parsed_log][level]}"
      "[@metadata][service]" => "%{[parsed_log][service]}"
      "[@metadata][environment]" => "%{[parsed_log][environment]}"
    }
  }

  # 提取关键字段
  if [parsed_log][message] {
    grok {
      match => {
        "[parsed_log][message]" => "%{WORD:action} %{DATA:resource} - %{GREEDYDATA:details}"
      }
      optional => true
    }
  }

  # 提取错误堆栈信息
  if [parsed_log][stacktrace] {
    mutate {
      add_field => { "error_stacktrace" => "%{[parsed_log][stacktrace]}" }
    }
  }

  # 添加环境和主机信息
  mutate {
    add_field => {
      "host.name" => "${HOSTNAME}"
      "service.name" => "foodtestlab-app"
      "service.version" => "3.1.0"
    }
  }

  # 性能日志处理
  if [parsed_log][duration_ms] {
    mutate {
      convert => { "[parsed_log][duration_ms]" => "float" }
    }
  }

  # 删除不需要的字段
  mutate {
    remove_field => [ "host", "@version" ]
  }
}

output {
  # 输出到 Elasticsearch
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "logs-foodtestlab-%{+YYYY.MM.dd}"
    document_type => "_doc"
  }

  # 同时输出到控制台用于调试
  if [@metadata][severity] == "ERROR" or [@metadata][severity] == "FATAL" {
    stdout {
      codec => rubydebug
    }
  }

  # 如果是错误或警告，也发送到特定的索引
  if [@metadata][severity] =~ /^(ERROR|WARN|FATAL)$/ {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      index => "logs-errors-%{+YYYY.MM.dd}"
      document_type => "_doc"
    }
  }
}
