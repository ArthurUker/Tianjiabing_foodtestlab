<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>调试信息</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #f0f0f0; }
        .log { background: white; padding: 10px; margin: 5px 0; border-left: 3px solid #007bff; }
        .error { border-left-color: #dc3545; color: #dc3545; }
        .success { border-left-color: #28a745; color: #28a745; }
    </style>
</head>
<body>
    <h1>调试信息</h1>
    <div id="logs"></div>

    <script>
        const logsContainer = document.getElementById('logs');
        
        function log(msg, type = 'info') {
            const div = document.createElement('div');
            div.className = `log ${type}`;
            div.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            logsContainer.appendChild(div);
            console.log(msg);
        }

        window.addEventListener('error', (e) => {
            log(`❌ Error: ${e.message} at ${e.filename}:${e.lineno}:${e.colno}`, 'error');
        });

        window.addEventListener('unhandledrejection', (e) => {
            log(`❌ Unhandled Promise Rejection: ${e.reason}`, 'error');
        });

        log('页面加载开始...', 'success');
        
        // 尝试导入主模块
        import('./js/main.js').then(() => {
            log('✅ main.js 导入成功', 'success');
        }).catch(err => {
            log(`❌ main.js 导入失败: ${err.message}`, 'error');
            log(`Stack: ${err.stack}`, 'error');
        });
    </script>
</body>
</html>
