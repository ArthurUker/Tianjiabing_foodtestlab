<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>浏览器测试报告上报（临时测试工具）</title>
    <link rel="stylesheet" href="/css/tailwind.css">
    <link rel="stylesheet" href="/css/vendor/fa/all.min.css" />
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f3f4f6; }
        .case-row { transition: background .15s; }
        .case-row:hover { background: #f9fafb; }
        select.result-passed { border-color: #22c55e; }
        select.result-failed { border-color: #ef4444; }
        select.result-skipped { border-color: #f59e0b; }
    </style>
</head>
<body class="min-h-screen">
    <!-- ═══════ 登录卡片 ═══════ -->
    <div id="loginWrap" class="max-w-md mx-auto mt-16 bg-white rounded-xl shadow-lg p-8 border border-gray-200">
        <div class="text-center mb-6">
            <i class="fas fa-vial text-3xl text-blue-600"></i>
            <h1 class="text-xl font-bold text-gray-800 mt-2">浏览器测试报告上报</h1>
            <p class="text-gray-400 text-xs mt-1">登录后按测试文档提交各用例执行结果（数据存入系统数据库，服务器可拉取汇总）</p>
        </div>
        <div id="loginError" class="hidden mb-4 p-3 rounded-lg bg-red-50 border border-red-200 text-red-700 text-sm"></div>
        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-xs text-gray-500 mb-1">学校代码</label>
                <input id="loginSchool" type="text" class="w-full border rounded-lg px-3 py-2 text-sm" placeholder="如 tjb" required>
            </div>
            <div>
                <label class="block text-xs text-gray-500 mb-1">用户名</label>
                <input id="loginUser" type="text" class="w-full border rounded-lg px-3 py-2 text-sm" placeholder="测试账号用户名" required>
            </div>
            <div>
                <label class="block text-xs text-gray-500 mb-1">密码</label>
                <input id="loginPass" type="password" class="w-full border rounded-lg px-3 py-2 text-sm" placeholder="密码" required>
            </div>
            <button type="submit" id="loginBtn" class="w-full py-2.5 bg-blue-600 text-white rounded-lg hover:bg-blue-700 text-sm font-medium">
                登 录
            </button>
        </form>
        <p class="text-center text-xs text-gray-400 mt-4">测试账号请联系平台超管分配（学校 manager / 超管均可）</p>
    </div>

    <!-- ═══════ 已登录：用例上报区 ═══════ -->
    <div id="reportWrap" class="hidden max-w-5xl mx-auto my-8 px-4">
        <!-- 顶部信息 + 汇总 -->
        <div class="flex items-center justify-between flex-wrap gap-3 mb-4">
            <div class="flex items-center gap-3">
                <i class="fas fa-clipboard-check text-2xl text-blue-600"></i>
                <div>
                    <h1 class="text-lg font-bold text-gray-800">浏览器测试报告上报</h1>
                    <p class="text-xs text-gray-400">当前用户：<b id="curUser" class="text-gray-600"></b>（<span id="curRole" class="text-gray-500"></span>）</p>
                    <div class="mt-1 flex items-center gap-2">
                        <label for="testerName" class="text-[10px] text-amber-600 font-medium shrink-0">测试人员姓名</label>
                        <input id="testerName" type="text" maxlength="50" placeholder="填姓名，便于同账号多人区分（保存后自动记住）" class="flex-1 min-w-0 border rounded px-2 py-1.5 text-sm sm:text-xs border-amber-300">
                    </div>
                </div>
            </div>
            <div class="flex flex-wrap items-center gap-2">
                <button id="saveAllBtn" title="把当前页所有已填写的测试结果一次性保存" class="px-4 py-2 text-sm rounded-lg bg-emerald-600 text-white font-semibold shadow hover:bg-emerald-700 flex-1 sm:flex-none"><i class="fas fa-save mr-1"></i>保存全部</button>
                <button id="syncBtn" title="保存后点这里：重新生成汇总报告并同步给所有测试人员" class="px-4 py-2 text-sm rounded-lg bg-indigo-600 text-white font-semibold shadow hover:bg-indigo-700 flex-1 sm:flex-none"><i class="fas fa-cloud-upload-alt mr-1"></i>同步</button>
                <button id="refreshBtn" class="px-3 py-2 text-xs rounded border border-gray-300 text-gray-600 hover:bg-gray-100"><i class="fas fa-sync mr-1"></i>刷新</button>
                <button id="logoutBtn" class="px-3 py-2 text-xs rounded border border-red-300 text-red-600 hover:bg-red-50"><i class="fas fa-sign-out-alt mr-1"></i>退出</button>
            </div>
        </div>

        <!-- 汇总卡（服务器可拉取 summary 看整体效果） -->
        <div id="summaryBar" class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6"></div>

        <!-- 分组用例表单 -->
        <div id="groupsWrap" class="space-y-6"></div>

        <!-- ═══════ 新问题反馈（清单外问题/缺陷上报，可补充更新） ═══════ -->
        <div class="bg-white rounded-xl border border-red-200 overflow-hidden">
            <div class="px-4 py-3 bg-red-50 border-b border-red-200 flex items-center gap-2">
                <i class="fas fa-bug text-red-500"></i>
                <h2 class="text-sm font-semibold text-gray-700">发现新问题？提交反馈</h2>
                <span class="text-xs text-gray-400 ml-1">（清单外的问题/缺陷；点下方列表里的"编辑"可补充更新已提交的反馈）</span>
            </div>
            <div class="px-4 py-3 space-y-3">
                <div>
                    <label class="block text-xs text-gray-500 mb-1">问题标题 *</label>
                    <input id="issueTitle" type="text" class="w-full border rounded px-2 py-1.5 text-sm" placeholder="一句话描述问题，如：新增记录时某字段校验失败">
                </div>
                <div>
                    <label class="block text-xs text-gray-500 mb-1">详细描述（复现步骤 / 期望 vs 实际）</label>
                    <textarea id="issueDetail" rows="2" class="w-full border rounded px-2 py-1.5 text-xs" placeholder="选填，写清复现步骤、期望表现和实际表现"></textarea>
                </div>
                <div>
                    <div class="flex items-center justify-between mb-1">
                        <span class="text-xs font-semibold text-gray-600"><i class="fas fa-images text-emerald-500 mr-1"></i>分步截图（按问题出现顺序一步一步加）</span>
                        <button type="button" id="issueStepAdd" class="px-3 py-1 text-xs font-medium rounded bg-emerald-600 text-white hover:bg-emerald-700 shadow-sm"><i class="fas fa-plus mr-1"></i>添加一步</button>
                    </div>
                    <div id="issueStepWrap" class="space-y-1.5">
                        <div class="text-[10px] text-gray-300 py-0.5">点击"添加一步"，按复现顺序逐步骤传截图</div>
                    </div>
                    <input type="hidden" id="issueEvidence" value="">
                </div>
                <div class="flex items-center gap-2 flex-wrap">
                    <button type="button" id="issueSubmitBtn" class="px-4 py-1.5 text-xs rounded bg-red-600 text-white hover:bg-red-700"><i class="fas fa-paper-plane mr-1"></i>提交 / 更新问题</button>
                    <button type="button" id="issueResetBtn" class="px-3 py-1.5 text-xs rounded border border-gray-300 text-gray-600 hover:bg-gray-100">清空</button>
                    <span id="issueCur" class="text-[10px] text-gray-400"></span>
                </div>
            </div>
            <div class="px-4 pb-3">
                <div class="text-xs font-semibold text-gray-500 mb-2">我已反馈的问题</div>
                <div id="issueList" class="space-y-2"></div>
            </div>
        </div>

        <p class="text-center text-xs text-gray-400 mt-8">提交的数据存于 public."TestResult"，测试结束后由开发从服务器拉取汇总。</p>
    </div>

    <script type="module">
        import { authService } from '/js/services/AuthService.js';

        const $ = (id) => document.getElementById(id);

        // ═══ 用例清单（权威副本在 backend/lib/testCaseDefs.js，此处启动时从 /api/test-results/defs 拉取）═══
        let CASE_DEFS = []

        const RESULT_OPTIONS = [
            ['passed', '✅ 通过'],
            ['failed', '❌ 失败'],
            ['skipped', '⏭ 跳过'],
            ['pending', '⏳ 待测'],
        ];

        function esc(s) {
            if (s == null) return ''
            return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
        }

        function apiHeaders() { return { 'Content-Type': 'application/json', 'Authorization': `Bearer ${authService.getToken()}` } }

        // ═══ 登录 ═══
        $('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault()
            const schoolCode = $('loginSchool').value.trim()
            const username = $('loginUser').value.trim()
            const password = $('loginPass').value
            const btn = $('loginBtn')
            btn.disabled = true; btn.textContent = '登录中…'
            $('loginError').classList.add('hidden')
            try {
                const r = await authService.login(username, password, schoolCode, true)
                if (!r.success) throw new Error(r.message || '登录失败')
                enterApp()
            } catch (err) {
                const el = $('loginError')
                el.textContent = '登录失败：' + (err.message || '请检查学校代码/用户名/密码')
                el.classList.remove('hidden')
            } finally {
                btn.disabled = false; btn.textContent = '登 录'
            }
        })

        function enterApp() {
            $('loginWrap').classList.add('hidden')
            $('reportWrap').classList.remove('hidden')
            const u = authService.getUser ? authService.getUser() : null
            $('curUser').textContent = (u && u.username) || 'unknown'
            $('curRole').textContent = (u && u.role) || ''
            initTesterName()
            loadDefs().then(loadAll)
        }

        // ═══ 从后端拉取用例清单（唯一权威副本 backend/lib/testCaseDefs.js）═══
        async function loadDefs() {
            try {
                const r = await fetch('/api/test-results/defs', { headers: apiHeaders() })
                const j = await r.json()
                if (j.success && Array.isArray(j.data) && j.data.length) {
                    CASE_DEFS = j.data
                    return
                }
                throw new Error(j.error || 'defs 为空')
            } catch (err) {
                console.error('加载用例清单失败:', err)
                alert('加载用例清单失败：' + (err.message || '请刷新重试'))
            }
        }

        // ═══ 加载已提交结果 + 汇总 ═══
        async function loadAll() {
            renderGroups()
            loadSummary()
            loadMyIssues()
            // 回填当前提交人已提交的结果（优先按测试人员姓名，无则按登录账号）
            try {
                const me = (authService.getUser ? authService.getUser() : null) || {}
                const who = testerName() || me.username || $('curUser').textContent || 'unknown'
                const r = await fetch(`/api/test-results?submitted_by=${encodeURIComponent(who)}`, { headers: apiHeaders() })
                const j = await r.json()
                const map = {}
                for (const it of (j.data || [])) map[it.case_id] = it
                for (const g of CASE_DEFS) {
                    for (const c of g.cases) {
                        const rec = map[c.id]
                        if (rec) fillRow(c.id, rec)
                    }
                }
            } catch { /* 回填失败不阻断 */ }
        }

        function fillRow(caseId, rec) {
            const sel = $(`sel_${caseId}`)
            const det = $(`det_${caseId}`)
            const evi = $(`evi_${caseId}`)
            const st = $(`st_${caseId}`)
            if (sel) { sel.value = rec.result; sel.classList.add(`result-${rec.result}`) }
            if (det) det.value = rec.detail || ''
            if (evi) { evi.value = rec.evidence || '' }
            // 用有序分步渲染回填证据
            renderSteps(caseId, evidenceSteps(rec.evidence || ''))
            if (st) st.textContent = rec.updated_at ? `已保存 ${new Date(rec.updated_at).toLocaleString('zh-CN')}` : ''
        }

        // ═══ 证据（有序分步）解析 / 渲染 / 上传 ═══
        // evidence 存储格式：JSON 字符串（有序步骤数组）
        //   [{"seq":1,"caption":"步骤1：打开登录页","urls":["/api/.../a.png"]}, ...]
        // 兼容旧数据：纯文本/URL 列表 → 归入一个"未分步"步骤

        function evidenceSteps(value) {
            if (value == null || value === '') return []
            if (typeof value === 'string' && value.trim().startsWith('[')) {
                try {
                    const arr = JSON.parse(value)
                    if (Array.isArray(arr)) return arr.filter((s) => s && typeof s === 'object')
                } catch { /* 回退到文本解析 */ }
            }
            // 旧格式：把非 JSON 文本按 URL 拆成一个步骤
            const urls = String(value).split(/[\n\r,;，；]+/).map((t) => t.trim()).filter(Boolean)
            return urls.length ? [{ seq: 1, caption: '', urls }] : []
        }

        // 从有序步骤序列化回 evidence 存储串（无步骤则存空串）
        function serializeSteps(caseId) {
            const wrap = $(`stepWrap_${caseId}`)
            if (!wrap) return ''
            const steps = []
            wrap.querySelectorAll('[data-step]').forEach((el) => {
                const idx = el.dataset.step
                const caption = (el.querySelector('.step-cap')?.value || '').trim()
                const urls = (el.querySelector('.step-evi')?.value || '').split(/[\n\r]+/).map((t) => t.trim()).filter(Boolean)
                if (caption || urls.length) steps.push({ seq: steps.length + 1, caption, urls })
            })
            return steps.length ? JSON.stringify(steps) : ''
        }

        // 把当前分步编辑器内容写回隐藏字段（保存时读取）
        function syncEvi(caseId) {
            const evi = $(`evi_${caseId}`)
            if (evi) evi.value = serializeSteps(caseId)
        }

        // 渲染某个用例的分步编辑器（steps: 有序步骤数组）
        function renderSteps(caseId, steps) {
            const wrap = $(`stepWrap_${caseId}`)
            if (!wrap) return
            const arr = Array.isArray(steps) ? steps : []
            wrap.innerHTML = arr.map((s, i) => `
                <div data-step="${i}" class="border border-gray-200 rounded p-2 sm:p-1.5 bg-white space-y-1.5">
                    <div class="flex items-center gap-1 flex-wrap">
                        <span class="text-[10px] font-bold text-gray-500 shrink-0">第 ${i + 1} 步</span>
                        <input class="step-cap flex-1 min-w-0 border rounded px-2 py-1.5 sm:px-1.5 sm:py-0.5 text-sm sm:text-[10px]" placeholder="本步说明，如：输入账号密码点登录" value="${esc(s.caption || '')}">
                        <div class="flex gap-0.5 shrink-0">
                            <button type="button" data-move="up" title="上移" class="step-move px-2 py-1 sm:px-1.5 sm:py-0.5 text-sm sm:text-[10px] rounded border border-gray-300 text-gray-500 hover:bg-gray-100"><i class="fas fa-arrow-up"></i></button>
                            <button type="button" data-move="down" title="下移" class="step-move px-2 py-1 sm:px-1.5 sm:py-0.5 text-sm sm:text-[10px] rounded border border-gray-300 text-gray-500 hover:bg-gray-100"><i class="fas fa-arrow-down"></i></button>
                            <button type="button" data-del title="删除本步" class="step-del px-2 py-1 sm:px-1.5 sm:py-0.5 text-sm sm:text-[10px] rounded border border-red-200 text-red-500 hover:bg-red-50"><i class="fas fa-trash-alt"></i></button>
                        </div>
                    </div>
                    <div class="flex gap-1 items-center">
                        <input type="file" class="step-file" accept="image/png,image/jpeg,image/webp,image/gif" multiple class="hidden">
                        <input class="step-evi flex-1 min-w-0 border rounded px-2 py-1.5 sm:px-1.5 sm:py-0.5 text-sm sm:text-[10px] font-mono" placeholder="截图 URL 或上传" value="${esc((s.urls || []).join('\n'))}">
                        <button type="button" data-upload title="上传本步截图" class="step-up px-2 py-1.5 sm:px-1.5 sm:py-0.5 text-sm sm:text-[10px] rounded bg-gray-600 text-white hover:bg-gray-700 shrink-0"><i class="fas fa-upload"></i></button>
                    </div>
                    <div class="step-preview flex flex-wrap gap-1"></div>
                    ${i === arr.length - 1 ? `
                    <button type="button" data-step-add-next class="w-full border border-dashed border-emerald-300 rounded py-1.5 text-xs text-emerald-700 hover:bg-emerald-50 hover:border-emerald-500">
                        <i class="fas fa-plus-circle mr-1"></i>添加下一步（第 ${arr.length + 1} 步）
                    </button>` : ''}
                </div>`).join('') || `<button type="button" data-case="${esc(caseId)}" class="step-add-empty w-full border-2 border-dashed border-emerald-300 rounded py-3 sm:py-2 text-sm sm:text-xs text-emerald-700 hover:bg-emerald-50 hover:border-emerald-500"><i class="fas fa-plus-circle mr-1"></i>点此处添加第 1 步（上传本步骤截图 + 写步骤说明）</button>`

            // 空状态按钮的点击委托
            const emptyBtn = wrap.querySelector('.step-add-empty')
            if (emptyBtn) emptyBtn.addEventListener('click', () => {
                const arr = evidenceSteps(serializeSteps(caseId))
                arr.push({ seq: arr.length + 1, caption: '', urls: [] })
                renderSteps(caseId, arr)
            })

            // 绑定各按钮
            wrap.querySelectorAll('[data-step]').forEach((card) => {
                const idx = Number(card.dataset.step)
                card.querySelector('.step-cap').addEventListener('input', () => { reindex(caseId); syncEvi(caseId) })
                card.querySelector('.step-evi').addEventListener('input', () => { renderStepPreview(card); syncEvi(caseId) })
                card.querySelector('.step-file').addEventListener('change', async (ev) => {
                    const fi = ev.target
                    if (!fi.files || !fi.files.length) return
                    const btn = card.querySelector('.step-up')
                    if (btn) btn.disabled = true
                    try {
                        const urls = await uploadEvidence(caseId, [...fi.files])
                        const evi = card.querySelector('.step-evi')
                        const cur = evi.value.trim()
                        evi.value = cur ? cur + '\n' + urls.join('\n') : urls.join('\n')
                        renderStepPreview(card); syncEvi(caseId)
                    } catch (err) { alert('上传失败：' + err.message) }
                    finally { if (btn) btn.disabled = false; fi.value = '' }
                })
                card.querySelector('.step-up').addEventListener('click', () => card.querySelector('.step-file').click())
                card.querySelector('.step-del').addEventListener('click', () => { card.remove(); reindex(caseId); syncEvi(caseId) })
                // 「+ 添加下一步」次要按钮（仅最后一步卡片有）—— 让"第 2 步在哪加"自解释,无需反复滚到顶部
                const nextBtn = card.querySelector('[data-step-add-next]')
                if (nextBtn) nextBtn.addEventListener('click', () => {
                    const arr = evidenceSteps(serializeSteps(caseId))
                    arr.push({ seq: arr.length + 1, caption: '', urls: [] })
                    renderSteps(caseId, arr)
                })
                card.querySelectorAll('.step-move').forEach((m) => m.addEventListener('click', () => {
                    const dir = m.dataset.move
                    const par = card.parentNode
                    const cards = [...par.querySelectorAll('[data-step]')]
                    const from = cards.indexOf(card)
                    const to = dir === 'up' ? from - 1 : from + 1
                    if (to >= 0 && to < cards.length) {
                        if (dir === 'up') par.insertBefore(card, cards[to])
                        else par.insertBefore(cards[to], card)
                        reindex(caseId); syncEvi(caseId)
                    }
                }))
            })
            renderAllStepPreviews(wrap)
            syncEvi(caseId)
        }

        function reindex(caseId) {
            const wrap = $(`stepWrap_${caseId}`)
            if (!wrap) return
            wrap.querySelectorAll('[data-step]').forEach((el, i) => {
                el.dataset.step = i
                const n = el.querySelector('.step-cap').parentNode.querySelector('span')
                if (n) n.textContent = `第 ${i + 1} 步`
            })
        }

        function renderStepPreview(card) {
            const evi = card.querySelector('.step-evi')
            const prev = card.querySelector('.step-preview')
            prev.innerHTML = String(evi?.value || '').split(/[\n\r]+/).map((t) => t.trim()).filter(Boolean).map((t) => {
                if (/^\/api\/test-results\/evidence\/|^https?:\/\//i.test(t)) {
                    return `<img src="${esc(t)}" alt="截图" class="h-12 w-16 object-cover rounded border border-gray-200 cursor-zoom-in" onclick="window.open(this.src,'_blank')" onerror="this.style.display='none'">`
                }
                return `<span class="text-[10px] text-gray-400 border border-gray-200 rounded px-1 py-0.5">${esc(t)}</span>`
            }).join('')
        }

        function renderAllStepPreviews(wrap) {
            wrap.querySelectorAll('[data-step]').forEach((card) => renderStepPreview(card))
        }

        // 上传证据图片（base64 JSON → 后端 /api/test-results/upload）
        async function uploadEvidence(caseId, fileList) {
            const files = []
            for (const f of fileList) {
                const data = await new Promise((resolve, reject) => {
                    const r = new FileReader()
                    r.onload = () => resolve(String(r.result).split(',')[1])
                    r.onerror = reject
                    r.readAsDataURL(f)
                })
                files.push({ name: f.name, type: f.type, data })
            }
            const r = await fetch('/api/test-results/upload', {
                method: 'POST',
                headers: apiHeaders(),
                body: JSON.stringify({ case_id: caseId, files }),
            })
            const j = await r.json()
            if (!j.success) throw new Error(j.error || '上传失败')
            return j.urls || []
        }

        // ═══ 渲染分组表单 ═══
        function renderGroups() {
            const wrap = $('groupsWrap')
            wrap.innerHTML = CASE_DEFS.map((g) => `
                <div class="bg-white rounded-xl border border-gray-200 overflow-hidden">
                    <div class="px-4 py-3 bg-gray-50 border-b border-gray-200 flex items-center gap-2">
                        <i class="fas fa-user text-blue-500"></i>
                        <h2 class="text-sm font-semibold text-gray-700">${esc(g.groupName)}</h2>
                        <span class="text-xs text-gray-400 ml-1">（${g.cases.length} 项）</span>
                    </div>
                    <div class="divide-y divide-gray-100">
                        ${g.cases.map((c) => `
                        <div class="case-row px-4 py-3 grid grid-cols-12 gap-3 items-start">
                            <div class="col-span-12 md:col-span-3">
                                <div class="text-xs font-mono text-blue-600">${esc(c.id)}</div>
                                <div class="text-xs text-gray-500 mt-0.5">${esc(c.title)}</div>
                            </div>
                            <div class="col-span-12 sm:col-span-6 md:col-span-2">
                                <select id="sel_${esc(c.id)}" class="w-full border rounded px-2 py-2 text-base sm:text-sm bg-white" onchange="this.classList.remove('result-passed','result-failed','result-skipped'); this.classList.add('result-'+this.value)">
                                    ${RESULT_OPTIONS.map(([v, l]) => `<option value="${v}">${l}</option>`).join('')}
                                </select>
                            </div>
                            <div class="col-span-12 md:col-span-5">
                                <div class="flex items-center justify-between mb-1">
                                    <span class="text-xs font-semibold text-gray-600"><i class="fas fa-images text-emerald-500 mr-1"></i>分步截图</span>
                                    <button type="button" data-case="${esc(c.id)}" title="按顺序新增一步（先做第1步再测的，就按顺序加）" class="step-add px-3 py-1 text-xs font-medium rounded bg-emerald-600 text-white hover:bg-emerald-700 shadow-sm"><i class="fas fa-plus mr-1"></i>添加一步</button>
                                </div>
                                <div class="text-[10px] text-gray-400 mb-1">按 bug 出现的先后顺序，一步一步添加（复测/复现步骤）</div>
                                <div id="stepWrap_${esc(c.id)}" class="space-y-1.5">
                                    <button type="button" data-case="${esc(c.id)}" class="step-add-empty w-full border-2 border-dashed border-emerald-300 rounded py-2 text-xs text-emerald-700 hover:bg-emerald-50 hover:border-emerald-500"><i class="fas fa-plus-circle mr-1"></i>点此处添加第 1 步（上传本步骤截图 + 写步骤说明）</button>
                                </div>
                                <input type="hidden" id="evi_${esc(c.id)}" value="">
                                <input type="file" id="file_${esc(c.id)}" accept="image/png,image/jpeg,image/webp,image/gif" multiple class="hidden">
                            </div>
                            <div class="col-span-12 md:col-span-3">
                                <div class="md:hidden text-[10px] text-gray-400 mb-0.5">实际表现（失败必填）</div>
                                <textarea id="det_${esc(c.id)}" rows="1" class="w-full border rounded px-2 py-2 text-sm sm:text-xs" placeholder="实际表现（失败必填，说明现象）"></textarea>
                            </div>
                            <div class="col-span-12 md:col-span-1 flex flex-row md:flex-col items-center md:items-end gap-2">
                                <button type="button" data-case="${esc(c.id)}" data-title="${esc(c.title)}" data-group="${esc(g.group)}"
                                    class="save-btn px-4 py-2 md:px-2 md:py-1 text-sm md:text-xs rounded-lg md:rounded bg-blue-600 text-white hover:bg-blue-700 w-full md:w-auto"><i class="fas fa-save mr-1"></i>保存</button>
                                <span id="st_${esc(c.id)}" class="text-[10px] text-gray-400"></span>
                            </div>
                        </div>`).join('')}
                    </div>
                </div>`).join('')

            wrap.querySelectorAll('.save-btn').forEach((b) => b.addEventListener('click', () => saveCase(b.dataset)))

            // "添加一步" → 两种入口都支持：顶部小按钮 + 空状态虚线大按钮
            const addStepHandler = (b) => {
                const caseId = b.dataset.case
                const wrap2 = $(`stepWrap_${caseId}`)
                if (!wrap2) return
                const arr = evidenceSteps(serializeSteps(caseId))
                arr.push({ seq: arr.length + 1, caption: '', urls: [] })
                renderSteps(caseId, arr)
            }
            wrap.querySelectorAll('.step-add, .step-add-empty').forEach((b) => b.addEventListener('click', () => addStepHandler(b)))

            // 初始化：为已回填的用例渲染分步（renderGroups 会先于 loadAll 调用，此处主要处理无数据时留空）
            wrap.querySelectorAll('[id^=stepWrap_]').forEach((w) => {
                const caseId = w.id.slice('stepWrap_'.length)
                if (!w.querySelector('[data-step]')) renderSteps(caseId, [])
            })
        }

        // ═══ 保存全部（当前页所有已填写的用例 + 新问题反馈）═══
        async function saveAll() {
            const btn = $('saveAllBtn')
            btn.disabled = true
            let saved = 0, failed = 0, firstErr = ''
            try {
                // 1) 正式用例：遍历所有结果下拉框，已选择的（含 pending）才保存；若仅填了详情/证据也算
                const promises = []
                for (const g of CASE_DEFS) {
                    for (const c of g.cases) {
                        const sel = $(`sel_${c.id}`)
                        const det = $(`det_${c.id}`)
                        const evi = $(`evi_${c.id}`)
                        if (!sel) continue
                        syncEvi(c.id) // 确保分步证据写回隐藏字段
                        const hasResult = !!sel.value
                        const hasDetail = (det && det.value.trim())
                        const hasEvidence = (evi && evi.value.trim())
                        if (!hasResult && !hasDetail && !hasEvidence) continue // 全空跳过
                        const payload = {
                            case_id: c.id, case_group: g.group, case_title: c.title,
                            result: hasResult ? sel.value : 'pending',
                            detail: det ? det.value : '', evidence: evi ? evi.value : '',
                            tester_name: testerName(),
                        }
                        promises.push(fetch('/api/test-results', {
                            method: 'POST', headers: apiHeaders(),
                            body: JSON.stringify(payload),
                        }).then((r) => r.json()).then((j) => {
                            if (!j.success) { failed++; if (!firstErr) firstErr = j.error || '保存失败' }
                            else { saved++; const st = $(`st_${c.id}`); if (st) st.textContent = `已保存 ${new Date().toLocaleString('zh-CN')}` }
                        }).catch((e) => { failed++; if (!firstErr) firstErr = e.message }))
                    }
                }
                // 2) 新问题反馈（若填写了标题）
                const ititle = $('issueTitle')
                if (ititle && ititle.value.trim()) {
                    const caseId = issueEditingId || newIssueId()
                    if (!issueEditingId) issueEditingId = caseId
                    $('issueEvidence').value = issueSerialize()
                    promises.push(fetch('/api/test-results', {
                        method: 'POST', headers: apiHeaders(),
                        body: JSON.stringify({
                            case_id: caseId, case_group: NEW_ISSUE_GROUP, case_title: ititle.value.trim(),
                            result: 'failed', detail: $('issueDetail').value.trim(),
                            evidence: $('issueEvidence').value, tester_name: testerName(),
                        }),
                    }).then((r) => r.json()).then((j) => {
                        if (!j.success) { failed++; if (!firstErr) firstErr = j.error || '保存失败' }
                        else { saved++; }
                    }).catch((e) => { failed++; if (!firstErr) firstErr = e.message }))
                }
                await Promise.all(promises)
                if (failed === 0) {
                    alert(`已保存 ${saved} 项测试结果。如需让所有测试人员看到最新汇总报告，请再点「同步」按钮。`)
                } else {
                    alert(`保存完成：成功 ${saved} 项，失败 ${failed} 项。${firstErr ? '错误：' + firstErr : ''}`)
                }
                loadSummary(); loadMyIssues()
            } finally { btn.disabled = false }
        }

        // ═══ 同步（重新生成汇总报告 + 重建 dist 部署目录）═══
        async function syncNow() {
            const btn = $('syncBtn')
            if (btn.disabled) return
            btn.disabled = true
            const orig = btn.innerHTML
            btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-1"></i>同步中...'
            try {
                const r = await fetch('/api/test-results/sync', { method: 'POST', headers: apiHeaders() })
                const j = await r.json()
                if (!j.success) throw new Error(j.error || '同步失败')
                alert(j.message || '同步完成')
            } catch (e) {
                alert('同步失败：' + e.message)
            } finally {
                btn.innerHTML = orig
                btn.disabled = false
            }
        }

        $('saveAllBtn').addEventListener('click', saveAll)
        $('syncBtn').addEventListener('click', syncNow)

        // ═══ 保存单条 ═══
        async function saveCase({ group, title, case: caseId }) {
            const sel = $(`sel_${caseId}`)
            const det = $(`det_${caseId}`)
            const evi = $(`evi_${caseId}`)
            const st = $(`st_${caseId}`)
            const btn = event.target.closest('.save-btn')
            btn.disabled = true
            try {
                const r = await fetch('/api/test-results', {
                    method: 'POST',
                    headers: apiHeaders(),
                    body: JSON.stringify({ case_id: caseId, case_group: group, case_title: title, result: sel.value, detail: det.value, evidence: evi.value, tester_name: testerName() }),
                })
                const j = await r.json()
                if (!j.success) throw new Error(j.error || '保存失败')
                sel.classList.remove('result-passed', 'result-failed', 'result-skipped'); sel.classList.add(`result-${sel.value}`)
                st.textContent = `已保存 ${new Date().toLocaleString('zh-CN')}`
                loadSummary()
            } catch (e) {
                st.textContent = '保存失败'
                alert('保存失败：' + e.message)
            } finally { btn.disabled = false }
        }

        // ═══ 汇总 ═══
        async function loadSummary() {
            try {
                const r = await fetch('/api/test-results/summary', { headers: apiHeaders() })
                const j = await r.json()
                const s = j.data || {}
                const icons = { passed: 'text-green-600', failed: 'text-red-600', skipped: 'text-amber-500', pending: 'text-gray-400' }
                const labels = { passed: '通过', failed: '失败', skipped: '跳过', pending: '待测' }
                const bar = $('summaryBar')
                bar.innerHTML = CASE_DEFS.map((g) => {
                    const gs = s[g.group] || {}
                    const total = g.cases.length
                    const done = (gs.passed || 0) + (gs.failed || 0) + (gs.skipped || 0)
                    return `<div class="bg-white rounded-lg border border-gray-200 p-3">
                        <div class="text-xs font-semibold text-gray-600 mb-2">${esc(g.groupName.split(' · ')[0])}</div>
                        <div class="text-2xl font-bold text-gray-800">${done}<span class="text-sm text-gray-400">/${total} 已测</span></div>
                        <div class="text-xs mt-1 space-x-2">
                            ${Object.keys(labels).map((k) => `<span class="${icons[k]}">${labels[k]} ${gs[k] || 0}</span>`).join('')}
                        </div>
                    </div>`
                }).join('')
            } catch { /* 汇总失败忽略 */ }
        }

        // ═══ 刷新 / 退出 ═══
        $('refreshBtn').addEventListener('click', loadAll)
        $('logoutBtn').addEventListener('click', async () => {
            await authService.logout().catch(() => {})
            location.reload()
        })

        // ═══════ 新问题反馈（清单外问题上报 / 更新） ═══════
        let issueEditingId = null // 正在编辑/草稿的 new_问题 case_id；null = 未开始
        const NEW_ISSUE_GROUP = 'new_问题'
        // 新增 issue 在首次"添加一步/上传"时即分配草稿 case_id，保证传图目录与提交 case_id 一致（避免图片 404）
        function ensureIssueId() {
            if (!issueEditingId) issueEditingId = newIssueId()
            return issueEditingId
        }

        function currentUsername() {
            const u = authService.getUser ? authService.getUser() : null
            return (u && u.username) || $('curUser').textContent || 'unknown'
        }

        // ═══ 测试人员姓名（同账号多人区分，localStorage 记住） ═══
        const TESTER_STORAGE_KEY = 'testreport.testerName'
        function testerName() { return ($('testerName')?.value || '').trim() }
        // 进入页面时回填上次填写的姓名；输入时自动保存
        function initTesterName() {
            const el = $('testerName')
            if (!el) return
            try { el.value = localStorage.getItem(TESTER_STORAGE_KEY) || '' } catch { /* ignore */ }
            el.addEventListener('input', () => { try { localStorage.setItem(TESTER_STORAGE_KEY, el.value) } catch { /* ignore */ } })
        }

        // 生成新问题的 case_id（NEW- + 时间戳），避免与正式用例冲突
        function newIssueId() {
            const d = new Date()
            const pad = (n) => String(n).padStart(2, '0')
            return `NEW-${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}`
        }

        async function loadMyIssues() {
            try {
                const r = await fetch(`/api/test-results?case_group=${encodeURIComponent(NEW_ISSUE_GROUP)}&submitted_by=${encodeURIComponent(testerName() || currentUsername())}`, { headers: apiHeaders() })
                const j = await r.json()
                const items = j.data || []
                const list = $('issueList')
                list.innerHTML = items.length
                    ? items.map((it) => `
                        <div class="flex items-start gap-2 border border-gray-100 rounded p-2 bg-gray-50">
                            <div class="flex-1 min-w-0">
                                <div class="text-xs font-medium text-gray-700">${esc(it.case_title || '（未填标题）')}</div>
                                <div class="text-[10px] text-gray-400 truncate">${esc(it.detail || '')}</div>
                                <div class="text-[10px] text-gray-300">${esc(it.case_id)} · ${new Date(it.updated_at).toLocaleString('zh-CN')}</div>
                            </div>
                            <button type="button" data-edit="${esc(it.case_id)}" class="issue-edit shrink-0 text-[10px] px-2 py-1 rounded border border-gray-300 text-gray-600 hover:bg-gray-100">编辑</button>
                        </div>`).join('')
                    : '<div class="text-[10px] text-gray-400">暂无反馈</div>'
                list.querySelectorAll('.issue-edit').forEach((b) => b.addEventListener('click', () => editIssue(b.dataset.edit)))
            } catch { /* 加载失败不阻断 */ }
        }

        // —— issue 专用分步证据（复用渲染逻辑，但绑定到 issueStepWrap） ——
        function issueSerialize() {
            const wrap = $('issueStepWrap')
            if (!wrap) return ''
            const steps = []
            wrap.querySelectorAll('[data-step]').forEach((el) => {
                const caption = (el.querySelector('.step-cap')?.value || '').trim()
                const urls = (el.querySelector('.step-evi')?.value || '').split(/[\n\r]+/).map((t) => t.trim()).filter(Boolean)
                if (caption || urls.length) steps.push({ seq: steps.length + 1, caption, urls })
            })
            return steps.length ? JSON.stringify(steps) : ''
        }
        function issueRenderSteps(arr) {
            const wrap = $('issueStepWrap')
            if (!wrap) return
            const steps = Array.isArray(arr) ? arr : []
            wrap.innerHTML = steps.map((s, i) => `
                <div data-step="${i}" class="border border-gray-200 rounded p-2 sm:p-1.5 bg-white space-y-1.5">
                    <div class="flex items-center gap-1 flex-wrap">
                        <span class="text-[10px] font-bold text-gray-500 shrink-0">第 ${i + 1} 步</span>
                        <input class="step-cap flex-1 min-w-0 border rounded px-2 py-1.5 sm:px-1.5 sm:py-0.5 text-sm sm:text-[10px]" placeholder="本步说明，如：输入错误密码点登录" value="${esc(s.caption || '')}">
                        <div class="flex gap-0.5 shrink-0">
                            <button type="button" data-move="up" class="step-move px-2 py-1 sm:px-1.5 sm:py-0.5 text-sm sm:text-[10px] rounded border border-gray-300 text-gray-500 hover:bg-gray-100"><i class="fas fa-arrow-up"></i></button>
                            <button type="button" data-move="down" class="step-move px-2 py-1 sm:px-1.5 sm:py-0.5 text-sm sm:text-[10px] rounded border border-gray-300 text-gray-500 hover:bg-gray-100"><i class="fas fa-arrow-down"></i></button>
                            <button type="button" data-del class="step-del px-2 py-1 sm:px-1.5 sm:py-0.5 text-sm sm:text-[10px] rounded border border-red-200 text-red-500 hover:bg-red-50"><i class="fas fa-trash-alt"></i></button>
                        </div>
                    </div>
                    <div class="flex gap-1 items-center">
                        <input type="file" class="step-file" accept="image/png,image/jpeg,image/webp,image/gif" multiple class="hidden">
                        <input class="step-evi flex-1 min-w-0 border rounded px-2 py-1.5 sm:px-1.5 sm:py-0.5 text-sm sm:text-[10px] font-mono" placeholder="截图 URL 或上传" value="${esc((s.urls || []).join('\n'))}">
                        <button type="button" data-upload class="step-up px-2 py-1.5 sm:px-1.5 sm:py-0.5 text-sm sm:text-[10px] rounded bg-gray-600 text-white hover:bg-gray-700 shrink-0"><i class="fas fa-upload"></i></button>
                    </div>
                    <div class="step-preview flex flex-wrap gap-1"></div>
                    ${i === steps.length - 1 ? `
                    <button type="button" data-step-add-next class="w-full border border-dashed border-emerald-300 rounded py-1.5 text-xs text-emerald-700 hover:bg-emerald-50 hover:border-emerald-500">
                        <i class="fas fa-plus-circle mr-1"></i>添加下一步（第 ${steps.length + 1} 步）
                    </button>` : ''}
                </div>`).join('') || `<button type="button" id="issueStepAddEmpty" class="w-full border-2 border-dashed border-emerald-300 rounded py-3 sm:py-2 text-sm sm:text-xs text-emerald-700 hover:bg-emerald-50 hover:border-emerald-500"><i class="fas fa-plus-circle mr-1"></i>点此处添加第 1 步（上传本步骤截图 + 写步骤说明）</button>`

            wrap.querySelectorAll('[data-step]').forEach((card) => {
                card.querySelector('.step-cap').addEventListener('input', () => { issueReindex(); $('issueEvidence').value = issueSerialize() })
                card.querySelector('.step-evi').addEventListener('input', () => { renderStepPreview(card); $('issueEvidence').value = issueSerialize() })
                card.querySelector('.step-file').addEventListener('change', async (ev) => {
                    const fi = ev.target
                    if (!fi.files || !fi.files.length) return
                    const btn = card.querySelector('.step-up'); if (btn) btn.disabled = true
                    try {
                        const urls = await uploadEvidence(ensureIssueId(), [...fi.files])
                        const evi = card.querySelector('.step-evi')
                        const cur = evi.value.trim()
                        evi.value = cur ? cur + '\n' + urls.join('\n') : urls.join('\n')
                        renderStepPreview(card); $('issueEvidence').value = issueSerialize()
                    } catch (err) { alert('上传失败：' + err.message) }
                    finally { if (btn) btn.disabled = false; fi.value = '' }
                })
                card.querySelector('.step-up').addEventListener('click', () => card.querySelector('.step-file').click())
                card.querySelector('.step-del').addEventListener('click', () => { card.remove(); issueReindex(); $('issueEvidence').value = issueSerialize() })
                // 「+ 添加下一步」次要按钮（issue 块）—— 与顶部 issueStepAdd 共用同一逻辑
                const issueNextBtn = card.querySelector('[data-step-add-next]')
                if (issueNextBtn) issueNextBtn.addEventListener('click', () => addIssueStep())
                card.querySelectorAll('.step-move').forEach((m) => m.addEventListener('click', () => {
                    const par = card.parentNode
                    const cards = [...par.querySelectorAll('[data-step]')]
                    const from = cards.indexOf(card)
                    const to = m.dataset.move === 'up' ? from - 1 : from + 1
                    if (to >= 0 && to < cards.length) {
                        if (m.dataset.move === 'up') par.insertBefore(card, cards[to]); else par.insertBefore(cards[to], card)
                        issueReindex(); $('issueEvidence').value = issueSerialize()
                    }
                }))
            })
            wrap.querySelectorAll('[data-step]').forEach((card) => renderStepPreview(card))
        }
        function issueReindex() {
            const wrap = $('issueStepWrap')
            if (!wrap) return
            wrap.querySelectorAll('[data-step]').forEach((el, i) => {
                el.dataset.step = i
                const n = el.querySelector('.step-cap').parentNode.querySelector('span')
                if (n) n.textContent = `第 ${i + 1} 步`
            })
        }

        async function editIssue(caseId) {
            try {
                const r = await fetch(`/api/test-results?case_group=${encodeURIComponent(NEW_ISSUE_GROUP)}&submitted_by=${encodeURIComponent(testerName() || currentUsername())}`, { headers: apiHeaders() })
                const j = await r.json()
                const rec = (j.data || []).find((it) => it.case_id === caseId)
                if (!rec) return alert('未找到该反馈')
                issueEditingId = caseId
                $('issueTitle').value = rec.case_title || ''
                $('issueDetail').value = rec.detail || ''
                $('issueEvidence').value = rec.evidence || ''
                issueRenderSteps(evidenceSteps(rec.evidence || ''))
                $('issueCur').textContent = `编辑中：${rec.case_id}（保存将覆盖原反馈）`
                $('issueTitle').focus()
            } catch { alert('加载反馈失败') }
        }

        async function submitIssue() {
            const title = $('issueTitle').value.trim()
            if (!title) return alert('请填写问题标题')
            const btn = $('issueSubmitBtn')
            btn.disabled = true
            try {
                const caseId = issueEditingId || newIssueId()
                $('issueEvidence').value = issueSerialize()
                if (!issueEditingId) issueEditingId = caseId
                const r = await fetch('/api/test-results', {
                    method: 'POST',
                    headers: apiHeaders(),
                    body: JSON.stringify({
                        case_id: caseId,
                        case_group: NEW_ISSUE_GROUP,
                        case_title: title,
                        result: 'failed',
                        detail: $('issueDetail').value.trim(),
                        evidence: $('issueEvidence').value,
                        tester_name: testerName(),
                    }),
                })
                const j = await r.json()
                if (!j.success) throw new Error(j.error || '保存失败')
                issueEditingId = null
                $('issueCur').textContent = `已保存（${caseId}）`
                $('issueTitle').value = ''; $('issueDetail').value = ''
                issueRenderSteps([])
                loadMyIssues()
            } catch (e) {
                alert('保存失败：' + e.message)
            } finally { btn.disabled = false }
        }

        $('issueSubmitBtn').addEventListener('click', submitIssue)
        $('issueResetBtn').addEventListener('click', () => {
            issueEditingId = null
            $('issueTitle').value = ''; $('issueDetail').value = ''
            issueRenderSteps([])
            $('issueCur').textContent = ''
        })
        const addIssueStep = () => {
            ensureIssueId()
            const arr = evidenceSteps(issueSerialize())
            arr.push({ seq: arr.length + 1, caption: '', urls: [] })
            issueRenderSteps(arr)
        }
        $('issueStepAdd').addEventListener('click', addIssueStep)
        // 空状态虚线大按钮（issueRenderSteps 动态生成）→ 事件委托
        $('issueStepWrap').addEventListener('click', (e) => {
            if (e.target.closest('#issueStepAddEmpty')) addIssueStep()
        })

        // 若已登录直接进入
        if (authService.getToken()) {
            enterApp()
        }
    </script>
</body>
</html>
