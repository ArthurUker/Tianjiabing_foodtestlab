<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>食品安全检验管理系统 - 登录</title>
    <script>
        // 登录成功后跳转目标：学校代码即 URL 路径首段（/<code>/index.html），
        // 与 extractSchoolCode 约定一致。若当前在 /<code>/login.html 或带 ?school=，则回跳 /<code>/index.html；
        // 否则（根部署/无 schoolCode）回退根 /index.html，避免跳错学校导致令牌命名空间不匹配。
        window.__schoolIndexUrl = function () {
            var m = location.pathname.match(/^\/([a-z0-9-]+)\//);
            var code = m ? m[1] : (new URLSearchParams(location.search).get('school') || '');
            return code ? ('/' + encodeURIComponent(code) + '/index.html') : '/index.html';
        };

        // 生产环境日志降噪，避免控制台被第三方/调试信息刷屏
        (function () {
            const isLocal = location.hostname === 'localhost' || location.hostname === '127.0.0.1'
            const debugByQuery = new URLSearchParams(location.search).get('debug') === 'true'
            const debugByStorage = localStorage.getItem('app_debug') === 'true'
            const enableDebug = isLocal || debugByQuery || debugByStorage

            if (enableDebug) {
                return
            }

            const raw = {
                log: console.log.bind(console),
                info: console.info.bind(console),
                debug: console.debug.bind(console),
                warn: console.warn.bind(console),
                error: console.error.bind(console)
            }

            console.log = function () {}
            console.info = function () {}
            console.debug = function () {}

            console.warn = function (...args) {
                const text = String(args[0] || '')
                if (text.includes('cdn.tailwindcss.com should not be used in production')) return
                raw.warn(...args)
            }

            console.error = function (...args) {
                const text = String(args[0] || '')
                if (text.includes('Untrusted event')) return
                raw.error(...args)
            }
        })()
    </script>
    
    <!-- Tailwind CSS (本地预编译) -->
    <link rel="stylesheet" href="/css/tailwind.css">

    <!-- 构建时注入的版本号（来自 package.json，先于 appVersion.js 加载） -->
    <script src="/version.js"></script>
    <!-- 系统版本号统一展示（读取 window.APP_VERSION_BUILD，全站避免版本漂移） -->
    <script src="/js/config/appVersion.js"></script>
    <!-- 预设主题（学校换肤） -->
    <script src="/js/utils/themePresets.js"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="/css/vendor/fa/all.min.css" />
    
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        
        .login-container {
            animation: slideIn 0.5s ease-out;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .logo-animation {
            animation: pulse 2s infinite;
            /* [居中修复] 默认盾牌图标 <i> 与经 JS 替换的 <img> 都需居中。
               <img> 为 replaced inline element，仅 text-align:center 在 chrome 实际渲染中不居中，
               故同时用 flex 容器兜底（JS 替换的 img 已加 block mx-auto，此处双重保险）。 */
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.8;
            }
        }
        
        .input-focus {
            transition: all 0.3s ease;
        }
        
        .input-focus:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .btn-loading {
            pointer-events: none;
        }
        
        .error-shake {
            animation: shake 0.3s ease-in-out;
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        /* 登录页自定义背景层（学校租户登录样式）：启用时隐藏默认 aurora 壁纸，改用专属背景 */
        body.login-bg-custom::before { display: none !important; }
        #loginBgLayer {
            position: fixed;
            inset: 0;
            z-index: -1;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
        #loginBgLayer::after {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, var(--ls-overlay, 0));
        }

        /* 友情链接（登录卡下方）。2026-09-28：链接由超管控制台「友情链接」视图维护，
           登录页读 GET /api/public/friendly-links 渲染，**按条数切换两种布局**：
             · 1 条 → 毛玻璃胶囊（历史样式，语义完整：「友情链接：<名称>」）；
             · ≥2 条 → 合并为**一条底栏**：统一「友情链接」标签 + 竖线分隔的名称列表。
           为什么不再用"多条胶囊"：名称长度差异会让胶囊宽窄不一、各占一行，视觉零散
           （实测截图反馈）；底栏方案对名称长度免疫（自然换行、不截断），且整块只占一行高。
           模式选择与渲染见 js/modules/loginPage.js 末尾 initFriendlyLinks()。 */
        .friendly-links {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            margin: 20px auto 0;
            max-width: 100%;
        }
        .friendly-link {
            display: flex;
            align-items: center;
            justify-content: center;
            width: fit-content;
            max-width: 100%;          /* 超长名称在窄屏不溢出 */
            padding: 7px 18px;
            border-radius: 999px;
            font-size: 13px;
            color: #374151;
            text-align: center;
            transition: color 0.2s ease;
        }
        .friendly-link i { margin-right: 8px; font-size: 12px; }
        .friendly-link:hover { color: #2563eb; }

        /* 多条：统一底栏（毛玻璃圆角条，居中，最多 4 条 + “+N” 展开） */
        .friendly-links__bar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 4px 10px;
            max-width: min(100%, 520px);
            padding: 7px 16px;
            border-radius: 14px;
            font-size: 12.5px;
            color: #4b5563;
            line-height: 1.5;
        }
        .friendly-links__bar-label {
            display: inline-flex;
            align-items: center;
            color: #9ca3af;
            font-size: 11.5px;
            letter-spacing: 0.04em;
            white-space: nowrap;
        }
        .friendly-links__bar-label i { margin-right: 6px; font-size: 11px; }
        .friendly-links__bar-items {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            row-gap: 2px;
            min-width: 0;
        }
        /* 竖线分隔：挂在"后一个条目"自身上，换行时不会留下孤立的悬空分隔符 */
        .friendly-links__bar-items > * + * {
            margin-left: 10px;
            padding-left: 10px;
            border-left: 1px solid rgba(148, 163, 184, 0.45);
        }
        .friendly-links__bar-items a {
            color: #374151;
            text-decoration: none;
            transition: color 0.2s ease;
            overflow-wrap: anywhere;   /* 超长名称就地换行，不撑破卡片 */
        }
        .friendly-links__bar-items a:hover { color: #2563eb; }
        .friendly-links__bar-more {
            background: none;
            border: 0;
            padding: 0;
            font: inherit;
            color: #6b7280;
            cursor: pointer;
            white-space: nowrap;
            text-decoration: underline dotted;
            text-underline-offset: 3px;
        }
        .friendly-links__bar-more:hover { color: #2563eb; }

        /* 全部友情链接弹层（条数超出底栏直显上限时由「全部 N 条」打开）。
           为什么用弹层：登录页是"门面"，链接再多也不能把登录卡下方撑成一大段文字；
           弹层内滚动展示全部（按分组），登录页本体始终只占一行。 */
        body.fl-all-open { overflow: hidden; }
        .fl-all-mask {
            position: fixed;
            inset: 0;
            z-index: 9998;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            background: rgba(15, 23, 42, 0.45);
            backdrop-filter: blur(3px);
            -webkit-backdrop-filter: blur(3px);
        }
        .fl-all-panel {
            display: flex;
            flex-direction: column;
            width: min(100%, 460px);
            max-height: min(78vh, 640px);
            background: #fff;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 24px 60px rgba(15, 23, 42, 0.3);
        }
        .fl-all-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 14px 18px;
            border-bottom: 1px solid #eef2f7;
        }
        .fl-all-title { display: flex; align-items: center; font-size: 15px; font-weight: 600; color: #1f2937; }
        .fl-all-title i { margin-right: 8px; color: #2563eb; }
        .fl-all-close { border: 0; background: none; padding: 0 2px; font-size: 20px; line-height: 1; color: #9ca3af; cursor: pointer; }
        .fl-all-close:hover { color: #4b5563; }
        .fl-all-body { flex: 1; overflow-y: auto; padding: 6px 6px 12px; }
        .fl-all-group { padding: 10px 12px 4px; font-size: 11.5px; color: #9ca3af; letter-spacing: 0.04em; }
        .fl-all-item {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 10px 12px;
            border-radius: 10px;
            text-decoration: none;
            color: inherit;
            transition: background 0.15s ease;
        }
        .fl-all-item:hover { background: #f1f5f9; }
        .fl-all-item .fl-icon {
            flex: 0 0 32px;
            width: 32px;
            height: 32px;
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #eff6ff;
            color: #2563eb;
            font-size: 14px;
        }
        .fl-all-item .fl-name { font-size: 13.5px; color: #1f2937; }
        .fl-all-item .fl-desc { margin-top: 2px; font-size: 12px; color: #6b7280; line-height: 1.5; overflow-wrap: anywhere; }
        .fl-all-foot { padding: 10px 18px; border-top: 1px solid #eef2f7; font-size: 11.5px; color: #9ca3af; }
    </style>
</head>
<body>
    <!-- 玻璃折射滤镜（零侵入，供 .glass backdrop-filter 引用） -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
      <filter id="lg-refraction" x="-20%" y="-20%" width="140%" height="140%">
        <feTurbulence type="fractalNoise" baseFrequency="0.012 0.02" numOctaves="2" seed="7" result="noise" />
        <feGaussianBlur in="noise" stdDeviation="2" result="blurredNoise" />
        <feDisplacementMap in="SourceGraphic" in2="blurredNoise" scale="9" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </svg>
    <script>
        // [RBAC 收敛] 访客入口改为按学校配置 guest_enabled 动态开关（由平台超管在超管界面按校配置）。
        // 默认关闭；学校配置开启后登录页显示访客 Tab。不再使用全局硬编码开关。
    </script>
    <div class="login-container w-full max-w-md">
        <!-- 学校识别错误提示：schoolCode 缺失/非法/不存在时显式提示，不静默回退默认学校 -->
        <div id="schoolError" class="hidden mb-4 p-3 rounded-lg bg-red-50 border border-red-200 text-red-700 text-sm"></div>
        <!-- 登录卡片 -->
        <div class="glass p-8">
            <!-- Logo 和标题 -->
            <div class="text-center mb-8">
                <div class="logo-animation mb-4">
                    <i class="fas fa-shield-alt text-4xl text-blue-600"></i>
                </div>
                <h1 id="schoolTitle" class="text-2xl font-bold text-gray-800 mb-2">食品安全检验系统</h1>
                <p id="schoolSubtitle" class="text-gray-500 text-sm">食品安全检验管理平台</p>
            </div>

            <!-- Tab 选项卡 -->
            <div class="flex mb-6 border-b border-gray-200" id="loginTabs">
                <button type="button" id="adminTabBtn" class="tab-btn flex-1 py-3 px-4 font-medium border-b-2 border-blue-600 text-blue-600 transition" data-tab="admin">
                    <i class="fas fa-user-shield mr-2"></i>管理员登录
                </button>
                <button type="button" id="guestTabBtn" class="tab-btn flex-1 py-3 px-4 font-medium text-gray-500 border-b-2 border-transparent hover:text-gray-700 transition" data-tab="guest">
                    <i class="fas fa-user-check mr-2"></i>访客登录
                </button>
            </div>

            <!-- 管理员登录表单 -->
            <form id="loginForm" class="form-tab space-y-5" data-tab="admin">
                <!-- 用户名输入 -->
                <div>
                    <label for="username" class="block text-sm font-medium text-gray-700 mb-2">
                        <i class="fas fa-user mr-2 text-blue-600"></i>用户名
                    </label>
                    <input 
                        type="text" 
                        id="username" 
                        name="username"
                        class="input-focus w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                        placeholder="请输入用户名"
                        required
                        autocomplete="username"
                    >
                </div>

                <!-- 密码输入 -->
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-2">
                        <i class="fas fa-lock mr-2 text-blue-600"></i>密码
                    </label>
                    <div class="relative">
                        <input 
                            type="password" 
                            id="password" 
                            name="password"
                            class="input-focus w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                            placeholder="请输入密码"
                            required
                            autocomplete="current-password"
                        >
                        <button 
                            type="button" 
                            id="togglePassword"
                            class="absolute right-3 top-2.5 text-gray-500 hover:text-gray-700"
                        >
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <!-- 记住我 & 忘记密码 -->
                <div class="flex items-center justify-between text-sm">
                    <label class="flex items-center text-gray-700" title="勾选后登录成功时,浏览器会提示保存用户名和密码,下次自动填充">
                        <input
                            type="checkbox"
                            id="rememberMe"
                            name="rememberMe"
                            class="mr-2 w-4 h-4 rounded border-gray-300"
                        >
                        记住我
                    </label>
                    <a href="#" id="forgotPasswordLink" class="text-blue-600 hover:text-blue-700 font-medium">忘记密码？</a>
                </div>

                <!-- 错误提示 -->
                <div id="errorMessage" class="hidden">
                    <div class="p-3 bg-red-100 border border-red-400 text-red-700 rounded-lg text-sm flex items-center">
                        <i class="fas fa-exclamation-circle mr-2"></i>
                        <span id="errorText"></span>
                    </div>
                </div>

                <!-- 登录按钮 -->
                <button 
                    type="submit" 
                    id="loginBtn"
                    class="w-full bg-gradient-to-r from-blue-600 to-blue-700 hover:from-blue-700 hover:to-blue-800 text-white font-semibold py-2.5 rounded-lg transition duration-300 shadow-lg hover:shadow-xl flex items-center justify-center"
                >
                    <i class="fas fa-sign-in-alt mr-2"></i>
                    <span id="loginBtnText">登 录</span>
                </button>
            </form>

            <!-- 访客区：仅只读快速浏览，通过 Tab 切换进入，不再重复显示独立的访客模式卡片 -->
            <div id="guestForm" class="form-tab hidden space-y-5" data-tab="guest">
                <p class="text-center text-sm text-gray-500">以访客身份进入后仅可查看学校已开放数据，无法新增、修改或导出。</p>

                <!-- 错误提示 -->
                <div id="guestErrorMessage" class="hidden">
                    <div class="p-3 bg-red-100 border border-red-400 text-red-700 rounded-lg text-sm flex items-center">
                        <i class="fas fa-exclamation-circle mr-2"></i>
                        <span id="guestErrorText"></span>
                    </div>
                </div>

                <button
                    type="button"
                    id="guestEnterBtn"
                    class="w-full bg-gradient-to-r from-green-600 to-green-700 hover:from-green-700 hover:to-green-800 text-white font-semibold py-3 rounded-lg transition duration-300 shadow-lg hover:shadow-xl flex items-center justify-center"
                >
                    <i class="fas fa-sign-in-alt mr-2"></i>
                    以访客身份进入
                </button>
            </div>

            <!-- 其他登录选项 (P8: 跳转帮助中心)
                 FIX-03: 统一走绝对路径 /help.html 并携带 school 参数（由下方模块脚本动态写入），
                 避免子路径部署（/code/login.html）下相对路径 ./help.html 解析到 /code/help.html 而 404。 -->
            <a id="helpCenterLink" href="/help.html" class="w-full py-2 px-4 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50 transition flex items-center justify-center">
                <i class="fas fa-question-circle mr-2"></i>
                需要帮助？
            </a>

            <!-- 底部提示 -->
            <div class="text-center mt-6 text-sm text-gray-600">
                <p>系统版本: <span data-app-version>3.1.0</span></p>
                <p class="text-xs text-gray-400 mt-2">© 2026 食品安全检验系统. 版权所有</p>
            </div>
        </div>

        <!-- 友情链接（2026-09-28）：由平台超管在 admin-schools.html「友情链接」视图维护，
             登录页读取免鉴权接口 GET /api/public/friendly-links 后按配置渲染
             （多条 / 排序 / 启停 / 点击统计），见 js/modules/loginPage.js 末尾。
             下方为**内置兜底链接**：接口不可用（离线 / 迁移窗口 / 网络异常）时保持与历史一致的行为；
             接口正常返回空列表时整个区域隐藏（代表超管有意清空）。 -->
        <div id="friendlyLinks" class="friendly-links">
            <a class="friendly-link glass"
               href="https://foodsafety.digifluidic.com/"
               target="_blank"
               rel="noopener noreferrer"
               data-fallback="1"
               title="校园食品安全「检·教·治」一体化推广方案（新窗口打开）">
                <i class="fas fa-link" aria-hidden="true"></i>
                <span>友情链接：校园食安卫士</span>
            </a>
        </div>

    </div>

    <!-- P1: 登录页逻辑抽离至 js/modules/loginPage.js（原 501 行内联 module） -->
    <script type="module" src="/js/modules/loginPage.js"></script>
</body>
</html>
