name: 部署和发布

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  prepare:
    name: 准备发布
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      changelog: ${{ steps.changelog.outputs.changelog }}

    steps:
    - name: 检出代码
      uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: 生成版本号
      id: version
      run: |
        if [[ ${{ github.ref }} == refs/tags/* ]]; then
          VERSION=${GITHUB_REF#refs/tags/}
        else
          VERSION=v$(date +%Y.%m.%d)
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: 生成更新日志
      id: changelog
      run: |
        CHANGELOG=$(git log --oneline --no-merges -n 10)
        echo "changelog<<EOF" >> $GITHUB_OUTPUT
        echo "$CHANGELOG" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

  build:
    name: 构建 Docker 镜像
    runs-on: ubuntu-latest
    needs: prepare
    permissions:
      contents: read
      packages: write

    steps:
    - name: 检出代码
      uses: actions/checkout@v3

    - name: 设置 Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: 登录 Container Registry
      uses: docker/login-action@v2
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: 提取元数据
      id: meta
      uses: docker/metadata-action@v4
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=semver,pattern={{version}},value=${{ needs.prepare.outputs.version }}
          type=ref,event=branch
          type=sha

    - name: 构建并推送 Docker 镜像
      uses: docker/build-push-action@v4
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  release:
    name: 发布版本
    runs-on: ubuntu-latest
    needs: [prepare, build]
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'

    steps:
    - name: 检出代码
      uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: 设置 Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18.x'
        cache: 'npm'

    - name: 安装依赖
      run: npm ci

    - name: 构建项目
      run: npm run build:prod
      env:
        NODE_ENV: production

    - name: 创建 GitHub Release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ needs.prepare.outputs.version }}
        release_name: Release ${{ needs.prepare.outputs.version }}
        body: |
          ## 更新日志
          ${{ needs.prepare.outputs.changelog }}
          
          ## 部署说明
          - 下载最新的 Docker 镜像
          - 运行部署脚本启动服务
          - 检查服务健康状态
        draft: false
        prerelease: false

    - name: 上传构建产物
      uses: actions/upload-artifact@v3
      with:
        name: release-${{ needs.prepare.outputs.version }}
        path: dist/
        retention-days: 90

  deploy-staging:
    name: 部署到预发布环境
    runs-on: ubuntu-latest
    needs: [prepare, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - name: 检出代码
      uses: actions/checkout@v3

    - name: 下载构建产物
      uses: actions/download-artifact@v3
      with:
        name: build-output
        path: dist/

    - name: 配置 SSH
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.STAGING_DEPLOY_KEY }}" > ~/.ssh/id_ed25519
        chmod 600 ~/.ssh/id_ed25519
        ssh-keyscan -H ${{ secrets.STAGING_HOST }} >> ~/.ssh/known_hosts

    - name: 部署到预发布环境
      run: |
        rsync -av \
          --exclude='.git' \
          --exclude='node_modules' \
          --exclude='.env' \
          dist/ \
          ${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }}:/app/foodtestlab-staging/

    - name: 运行部署后脚本
      run: |
        ssh ${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }} \
          "cd /app/foodtestlab-staging && \
           npm install --production && \
           npm run build && \
           systemctl restart foodtestlab-staging"

    - name: 验证部署
      run: |
        curl -f https://staging.foodtestlab.local/api/health || exit 1

    - name: 运行烟雾测试
      run: |
        npm run test:e2e -- --env apiUrl=https://staging.foodtestlab.local
      continue-on-error: true

  deploy-production:
    name: 部署到生产环境
    runs-on: ubuntu-latest
    needs: [prepare, deploy-staging]
    if: github.ref == 'refs/heads/main' && startsWith(github.ref, 'refs/tags/')
    environment:
      name: production
      url: https://foodtestlab.local

    steps:
    - name: 检出代码
      uses: actions/checkout@v3

    - name: 下载构建产物
      uses: actions/download-artifact@v3
      with:
        name: build-output
        path: dist/

    - name: 配置 SSH
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.PROD_DEPLOY_KEY }}" > ~/.ssh/id_ed25519
        chmod 600 ~/.ssh/id_ed25519
        ssh-keyscan -H ${{ secrets.PROD_HOST }} >> ~/.ssh/known_hosts

    - name: 创建备份
      run: |
        ssh ${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }} \
          "cd /app && tar -czf foodtestlab-backup-$(date +%Y%m%d-%H%M%S).tar.gz foodtestlab/"

    - name: 部署到生产环境
      run: |
        rsync -av \
          --delete \
          --exclude='.git' \
          --exclude='node_modules' \
          --exclude='.env' \
          dist/ \
          ${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }}:/app/foodtestlab/

    - name: 运行部署后脚本
      run: |
        ssh ${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }} \
          "cd /app/foodtestlab && \
           npm install --production && \
           npm run build && \
           systemctl restart foodtestlab && \
           sleep 5"

    - name: 验证生产部署
      run: |
        for i in {1..30}; do
          if curl -f https://foodtestlab.local/api/health; then
            echo "✅ 部署成功"
            exit 0
          fi
          echo "等待服务启动... ($i/30)"
          sleep 2
        done
        echo "❌ 部署失败"
        exit 1

    - name: 运行生产烟雾测试
      run: |
        npm run test:e2e -- --env apiUrl=https://foodtestlab.local
      continue-on-error: true

    - name: 发送部署通知
      if: success()
      uses: actions/github-script@v6
      with:
        script: |
          const message = `
          ✅ 生产部署成功
          版本: ${{ needs.prepare.outputs.version }}
          时间: $(date)
          应用链接: https://foodtestlab.local
          `;
          console.log(message);

  rollback:
    name: 回滚部署
    runs-on: ubuntu-latest
    if: failure() && github.ref == 'refs/heads/main'

    steps:
    - name: 检查上一个成功的构建
      uses: actions/github-script@v6
      id: prev-build
      with:
        script: |
          const runs = await github.rest.actions.listWorkflowRuns({
            owner: context.repo.owner,
            repo: context.repo.repo,
            workflow_id: 'deploy.yml',
            status: 'completed',
            conclusion: 'success',
            per_page: 1
          });
          
          if (runs.data.workflow_runs.length > 0) {
            return runs.data.workflow_runs[0].id;
          }
          throw new Error('未找到上一个成功的构建');

    - name: 回滚到上一个版本
      run: |
        ssh ${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }} \
          "cd /app && \
           LATEST_BACKUP=\$(ls -t foodtestlab-backup-*.tar.gz | head -1) && \
           tar -xzf \$LATEST_BACKUP && \
           systemctl restart foodtestlab"

    - name: 验证回滚
      run: |
        curl -f https://foodtestlab.local/api/health || exit 1

  notify:
    name: 部署通知
    runs-on: ubuntu-latest
    if: always()
    needs: [deploy-production]

    steps:
    - name: 发送钉钉通知 - 成功
      if: success()
      run: |
        echo "部署成功，发送钉钉通知"

    - name: 发送钉钉通知 - 失败
      if: failure()
      run: |
        echo "部署失败，发送钉钉通知"

    - name: 发送邮件通知
      uses: dawidd6/action-send-mail@v3
      if: failure()
      with:
        server_address: ${{ secrets.EMAIL_SERVER }}
        server_port: ${{ secrets.EMAIL_PORT }}
        username: ${{ secrets.EMAIL_USER }}
        password: ${{ secrets.EMAIL_PASSWORD }}
        subject: "🚨 食品安全系统生产部署失败"
        to: admin@example.com
        from: ci@example.com
        body: |
          部署失败详情:
          仓库: ${{ github.repository }}
          分支: ${{ github.ref }}
          提交: ${{ github.sha }}
          构建链接: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
