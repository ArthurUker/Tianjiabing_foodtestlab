apiVersion: 1

datasources:
  # ==================== Prometheus ====================
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: 30s
    version: 1

  # ==================== Elasticsearch ====================
  - name: Elasticsearch
    type: elasticsearch
    access: proxy
    url: http://elasticsearch:9200
    database: logs-*
    jsonData:
      esVersion: 8.6.0
      timeField: "@timestamp"
      logMessageField: "message"
      logLevelField: "level"
      maxConcurrentShardRequests: 256
    version: 1

  # ==================== Jaeger ====================
  - name: Jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686
    jsonData:
      nodeGraph:
        enabled: true
    version: 1

  # ==================== Loki (用于日志, 可选) ====================
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    version: 1
