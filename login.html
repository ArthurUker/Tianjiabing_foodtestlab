<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>食品安全检验管理系统 - 登录</title>
    <script>
        // 登录成功后跳转目标：学校代码即 URL 路径首段（/<code>/index.html），
        // 与 extractSchoolCode 约定一致。若当前在 /<code>/login.html 或带 ?school=，则回跳 /<code>/index.html；
        // 否则（根部署/无 schoolCode）回退根 /index.html，避免跳错学校导致令牌命名空间不匹配。
        window.__schoolIndexUrl = function () {
            var m = location.pathname.match(/^\/([a-z0-9-]+)\//);
            var code = m ? m[1] : (new URLSearchParams(location.search).get('school') || '');
            return code ? ('/' + encodeURIComponent(code) + '/index.html') : '/index.html';
        };

        // 生产环境日志降噪，避免控制台被第三方/调试信息刷屏
        (function () {
            const isLocal = location.hostname === 'localhost' || location.hostname === '127.0.0.1'
            const debugByQuery = new URLSearchParams(location.search).get('debug') === 'true'
            const debugByStorage = localStorage.getItem('app_debug') === 'true'
            const enableDebug = isLocal || debugByQuery || debugByStorage

            if (enableDebug) {
                return
            }

            const raw = {
                log: console.log.bind(console),
                info: console.info.bind(console),
                debug: console.debug.bind(console),
                warn: console.warn.bind(console),
                error: console.error.bind(console)
            }

            console.log = function () {}
            console.info = function () {}
            console.debug = function () {}

            console.warn = function (...args) {
                const text = String(args[0] || '')
                if (text.includes('cdn.tailwindcss.com should not be used in production')) return
                raw.warn(...args)
            }

            console.error = function (...args) {
                const text = String(args[0] || '')
                if (text.includes('Untrusted event')) return
                raw.error(...args)
            }
        })()
    </script>
    
    <!-- Tailwind CSS (本地预编译) -->
    <link rel="stylesheet" href="/css/tailwind.css">

    <!-- 系统版本号唯一事实来源（全站统一展示，避免版本漂移） -->
    <script src="/js/config/appVersion.js"></script>
    <!-- 预设主题（学校换肤） -->
    <script src="/js/utils/themePresets.js"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="/css/vendor/fa/all.min.css" />
    
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        
        .login-container {
            animation: slideIn 0.5s ease-out;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .logo-animation {
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.8;
            }
        }
        
        .input-focus {
            transition: all 0.3s ease;
        }
        
        .input-focus:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .btn-loading {
            pointer-events: none;
        }
        
        .error-shake {
            animation: shake 0.3s ease-in-out;
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        /* 登录页自定义背景层（学校租户登录样式）：启用时隐藏默认 aurora 壁纸，改用专属背景 */
        body.login-bg-custom::before { display: none !important; }
        #loginBgLayer {
            position: fixed;
            inset: 0;
            z-index: -1;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
        #loginBgLayer::after {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, var(--ls-overlay, 0));
        }
    </style>
</head>
<body>
    <!-- 玻璃折射滤镜（零侵入，供 .glass backdrop-filter 引用） -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
      <filter id="lg-refraction" x="-20%" y="-20%" width="140%" height="140%">
        <feTurbulence type="fractalNoise" baseFrequency="0.012 0.02" numOctaves="2" seed="7" result="noise" />
        <feGaussianBlur in="noise" stdDeviation="2" result="blurredNoise" />
        <feDisplacementMap in="SourceGraphic" in2="blurredNoise" scale="9" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </svg>
    <script>
        // [RBAC 收敛] 访客入口改为按学校配置 guest_enabled 动态开关（由平台超管在超管界面按校配置）。
        // 默认关闭；学校配置开启后登录页显示访客 Tab。不再使用全局硬编码开关。
    </script>
    <div class="login-container w-full max-w-md">
        <!-- 学校识别错误提示：schoolCode 缺失/非法/不存在时显式提示，不静默回退默认学校 -->
        <div id="schoolError" class="hidden mb-4 p-3 rounded-lg bg-red-50 border border-red-200 text-red-700 text-sm"></div>
        <!-- 登录卡片 -->
        <div class="glass p-8">
            <!-- Logo 和标题 -->
            <div class="text-center mb-8">
                <div class="logo-animation mb-4">
                    <i class="fas fa-shield-alt text-4xl text-blue-600"></i>
                </div>
                <h1 id="schoolTitle" class="text-2xl font-bold text-gray-800 mb-2">食品安全检验系统</h1>
                <p id="schoolSubtitle" class="text-gray-500 text-sm">食品安全检验管理平台</p>
            </div>

            <!-- Tab 选项卡 -->
            <div class="flex mb-6 border-b border-gray-200" id="loginTabs">
                <button type="button" id="adminTabBtn" class="tab-btn flex-1 py-3 px-4 font-medium border-b-2 border-blue-600 text-blue-600 transition" data-tab="admin">
                    <i class="fas fa-user-shield mr-2"></i>管理员登录
                </button>
                <button type="button" id="guestTabBtn" class="tab-btn flex-1 py-3 px-4 font-medium text-gray-500 border-b-2 border-transparent hover:text-gray-700 transition" data-tab="guest">
                    <i class="fas fa-user-check mr-2"></i>访客登录
                </button>
            </div>

            <!-- 管理员登录表单 -->
            <form id="loginForm" class="form-tab space-y-5" data-tab="admin">
                <!-- 用户名输入 -->
                <div>
                    <label for="username" class="block text-sm font-medium text-gray-700 mb-2">
                        <i class="fas fa-user mr-2 text-blue-600"></i>用户名
                    </label>
                    <input 
                        type="text" 
                        id="username" 
                        name="username"
                        class="input-focus w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                        placeholder="请输入用户名"
                        required
                        autocomplete="username"
                    >
                </div>

                <!-- 密码输入 -->
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-2">
                        <i class="fas fa-lock mr-2 text-blue-600"></i>密码
                    </label>
                    <div class="relative">
                        <input 
                            type="password" 
                            id="password" 
                            name="password"
                            class="input-focus w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                            placeholder="请输入密码"
                            required
                            autocomplete="current-password"
                        >
                        <button 
                            type="button" 
                            id="togglePassword"
                            class="absolute right-3 top-2.5 text-gray-500 hover:text-gray-700"
                        >
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <!-- 记住我 & 忘记密码 -->
                <div class="flex items-center justify-between text-sm">
                    <label class="flex items-center text-gray-700" title="勾选后登录成功时,浏览器会提示保存用户名和密码,下次自动填充">
                        <input
                            type="checkbox"
                            id="rememberMe"
                            name="rememberMe"
                            class="mr-2 w-4 h-4 rounded border-gray-300"
                        >
                        记住我
                    </label>
                    <a href="#" id="forgotPasswordLink" class="text-blue-600 hover:text-blue-700 font-medium">忘记密码？</a>
                </div>

                <!-- 错误提示 -->
                <div id="errorMessage" class="hidden">
                    <div class="p-3 bg-red-100 border border-red-400 text-red-700 rounded-lg text-sm flex items-center">
                        <i class="fas fa-exclamation-circle mr-2"></i>
                        <span id="errorText"></span>
                    </div>
                </div>

                <!-- 登录按钮 -->
                <button 
                    type="submit" 
                    id="loginBtn"
                    class="w-full bg-gradient-to-r from-blue-600 to-blue-700 hover:from-blue-700 hover:to-blue-800 text-white font-semibold py-2.5 rounded-lg transition duration-300 shadow-lg hover:shadow-xl flex items-center justify-center"
                >
                    <i class="fas fa-sign-in-alt mr-2"></i>
                    <span id="loginBtnText">登 录</span>
                </button>
            </form>

            <!-- 访客区：仅只读快速浏览 + 申请 viewer 账号 -->
            <div id="guestForm" class="form-tab hidden" data-tab="guest">
                <div class="text-center py-2">
                    <div class="bg-green-50 border border-green-100 rounded-lg p-5 mb-5">
                        <i class="fas fa-user-check text-3xl text-green-500 mb-3 block"></i>
                        <p class="text-gray-700 font-medium mb-1">访客模式</p>
                        <p class="text-gray-500 text-sm">仅可查看学校已开放的数据，无法新增、修改或导出</p>
                    </div>

                    <!-- 错误提示 -->
                    <div id="guestErrorMessage" class="hidden">
                        <div class="mb-4 p-3 bg-red-100 border border-red-400 text-red-700 rounded-lg text-sm flex items-center">
                            <i class="fas fa-exclamation-circle mr-2"></i>
                            <span id="guestErrorText"></span>
                        </div>
                    </div>

                    <!-- 子标签：快速进入 / 申请 viewer 账号 -->
                    <div class="flex mb-4 border-b border-gray-200 text-sm">
                        <button type="button" id="guestQuickTab" class="flex-1 py-2 font-medium text-green-600 border-b-2 border-green-600">快速进入</button>
                        <button type="button" id="guestApplyTab" class="flex-1 py-2 font-medium text-gray-500 border-b-2 border-transparent hover:text-gray-700">申请 viewer 账号</button>
                    </div>

                    <!-- 快速进入面板（只读浏览已开放界面） -->
                    <div id="guestQuickPane">
                        <button 
                            type="button" 
                            id="guestEnterBtn"
                            class="w-full bg-gradient-to-r from-green-600 to-green-700 hover:from-green-700 hover:to-green-800 text-white font-semibold py-3 rounded-lg transition duration-300 shadow-lg hover:shadow-xl flex items-center justify-center"
                        >
                            <i class="fas fa-sign-in-alt mr-2"></i>
                            以访客身份进入
                        </button>
                        <p class="text-xs text-gray-400 mt-3">无需申请即可只读浏览已开放数据，但无法查看病原体或提交申请。</p>
                    </div>

                    <!-- 申请 viewer 账号面板（提交后由学校 manager 审批） -->
                    <div id="guestApplyPane" class="hidden">
                        <input type="text" id="appUsername" placeholder="用户名（3-32位字母/数字/下划线）" class="w-full mb-3 px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent" />
                        <input type="password" id="appPassword" placeholder="密码（至少8位）" class="w-full mb-3 px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent" />
                        <input type="text" id="appFullName" placeholder="姓名（选填）" class="w-full mb-3 px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent" />
                        <input type="tel" id="appPhone" placeholder="手机号（选填）" class="w-full mb-3 px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent" />
                        <input type="email" id="appEmail" placeholder="邮箱（选填）" class="w-full mb-3 px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent" />
                        <button type="button" id="appSubmitBtn" class="w-full bg-gradient-to-r from-green-600 to-green-700 hover:from-green-700 hover:to-green-800 text-white font-semibold py-3 rounded-lg transition duration-300 shadow-lg hover:shadow-xl flex items-center justify-center">
                            <i class="fas fa-paper-plane mr-2"></i>
                            提交申请
                        </button>
                        <p class="text-xs text-gray-400 mt-3">申请 viewer 账号（只读，含病原体数据），提交后需学校管理员审批，通过后方可登录。</p>
                        <div id="appSuccessMsg" class="hidden mt-3 p-3 bg-green-50 border border-green-200 text-green-700 rounded-lg text-sm">
                            <i class="fas fa-check-circle mr-1"></i> 申请已提交，请等待学校管理员审批。审批通过后即可用该账号登录。
                        </div>
                    </div>
                </div>
            </div>

            <!-- 其他登录选项 (P8: 跳转帮助中心)
                 FIX-03: 统一走绝对路径 /help.html 并携带 school 参数（由下方模块脚本动态写入），
                 避免子路径部署（/code/login.html）下相对路径 ./help.html 解析到 /code/help.html 而 404。 -->
            <a id="helpCenterLink" href="/help.html" class="w-full py-2 px-4 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50 transition flex items-center justify-center">
                <i class="fas fa-question-circle mr-2"></i>
                需要帮助？
            </a>

            <!-- 底部提示 -->
            <div class="text-center mt-6 text-sm text-gray-600">
                <p>系统版本: <span data-app-version>3.1.0</span></p>
                <p class="text-xs text-gray-400 mt-2">© 2026 食品安全检验系统. 版权所有</p>
            </div>
        </div>

    </div>

    <!-- P1: 登录页逻辑抽离至 js/modules/loginPage.js（原 501 行内联 module） -->
    <script type="module" src="/js/modules/loginPage.js"></script>
</body>
</html>
