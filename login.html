<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>食品安全检验管理系统 - 登录</title>
    <script>
        // 生产环境日志降噪，避免控制台被第三方/调试信息刷屏
        (function () {
            const isLocal = location.hostname === 'localhost' || location.hostname === '127.0.0.1'
            const debugByQuery = new URLSearchParams(location.search).get('debug') === 'true'
            const debugByStorage = localStorage.getItem('app_debug') === 'true'
            const enableDebug = isLocal || debugByQuery || debugByStorage

            if (enableDebug) {
                return
            }

            const raw = {
                log: console.log.bind(console),
                info: console.info.bind(console),
                debug: console.debug.bind(console),
                warn: console.warn.bind(console),
                error: console.error.bind(console)
            }

            console.log = function () {}
            console.info = function () {}
            console.debug = function () {}

            console.warn = function (...args) {
                const text = String(args[0] || '')
                if (text.includes('cdn.tailwindcss.com should not be used in production')) return
                raw.warn(...args)
            }

            console.error = function (...args) {
                const text = String(args[0] || '')
                if (text.includes('Untrusted event')) return
                raw.error(...args)
            }
        })()
    </script>
    
    <!-- Tailwind CSS (本地预编译) -->
    <link rel="stylesheet" href="./css/tailwind.css">
    <!-- 预设主题（学校换肤） -->
    <script src="./js/utils/themePresets.js"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        
        .login-container {
            animation: slideIn 0.5s ease-out;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .logo-animation {
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.8;
            }
        }
        
        .input-focus {
            transition: all 0.3s ease;
        }
        
        .input-focus:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .btn-loading {
            pointer-events: none;
        }
        
        .error-shake {
            animation: shake 0.3s ease-in-out;
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
    </style>
</head>
<body>
    <!-- 玻璃折射滤镜（零侵入，供 .glass backdrop-filter 引用） -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
      <filter id="lg-refraction" x="-20%" y="-20%" width="140%" height="140%">
        <feTurbulence type="fractalNoise" baseFrequency="0.012 0.02" numOctaves="2" seed="7" result="noise" />
        <feGaussianBlur in="noise" stdDeviation="2" result="blurredNoise" />
        <feDisplacementMap in="SourceGraphic" in2="blurredNoise" scale="9" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </svg>
    <script>
        // 访客入口开关：false 时隐藏登录页中的访客入口，但保留相关实现代码
        window.__ENABLE_GUEST_ENTRY__ = false;
    </script>
    <div class="login-container w-full max-w-md">
        <!-- 登录卡片 -->
        <div class="glass p-8">
            <!-- Logo 和标题 -->
            <div class="text-center mb-8">
                <div class="logo-animation mb-4">
                    <i class="fas fa-shield-alt text-4xl text-blue-600"></i>
                </div>
                <h1 id="schoolTitle" class="text-2xl font-bold text-gray-800 mb-2">食品安全检验系统</h1>
                <p id="schoolSubtitle" class="text-gray-500 text-sm">食品安全检验管理平台</p>
            </div>

            <!-- Tab 选项卡 -->
            <div class="flex mb-6 border-b border-gray-200" id="loginTabs">
                <button type="button" id="adminTabBtn" class="tab-btn flex-1 py-3 px-4 font-medium text-gray-700 border-b-2 border-blue-600 text-blue-600 transition" data-tab="admin">
                    <i class="fas fa-user-shield mr-2"></i>管理员登录
                </button>
                <button type="button" id="guestTabBtn" class="tab-btn flex-1 py-3 px-4 font-medium text-gray-500 border-b-2 border-transparent hover:text-gray-700 transition" data-tab="guest">
                    <i class="fas fa-user-check mr-2"></i>访客登录
                </button>
            </div>

            <!-- 管理员登录表单 -->
            <form id="loginForm" class="form-tab space-y-5" data-tab="admin">
                <!-- 用户名输入 -->
                <div>
                    <label for="username" class="block text-sm font-medium text-gray-700 mb-2">
                        <i class="fas fa-user mr-2 text-blue-600"></i>用户名
                    </label>
                    <input 
                        type="text" 
                        id="username" 
                        name="username"
                        class="input-focus w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                        placeholder="请输入用户名"
                        required
                        autocomplete="username"
                    >
                </div>

                <!-- 密码输入 -->
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-2">
                        <i class="fas fa-lock mr-2 text-blue-600"></i>密码
                    </label>
                    <div class="relative">
                        <input 
                            type="password" 
                            id="password" 
                            name="password"
                            class="input-focus w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                            placeholder="请输入密码"
                            required
                            autocomplete="current-password"
                        >
                        <button 
                            type="button" 
                            id="togglePassword"
                            class="absolute right-3 top-2.5 text-gray-500 hover:text-gray-700"
                        >
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <!-- 记住我 & 忘记密码 -->
                <div class="flex items-center justify-between text-sm">
                    <label class="flex items-center text-gray-700">
                        <input 
                            type="checkbox" 
                            id="rememberMe" 
                            name="rememberMe"
                            class="mr-2 w-4 h-4 rounded border-gray-300"
                        >
                        记住我
                    </label>
                    <a href="#" class="text-blue-600 hover:text-blue-700 font-medium">忘记密码？</a>
                </div>

                <!-- 错误提示 -->
                <div id="errorMessage" class="hidden p-3 bg-red-100 border border-red-400 text-red-700 rounded-lg text-sm flex items-center">
                    <i class="fas fa-exclamation-circle mr-2"></i>
                    <span id="errorText"></span>
                </div>

                <!-- 登录按钮 -->
                <button 
                    type="submit" 
                    id="loginBtn"
                    class="w-full bg-gradient-to-r from-blue-600 to-blue-700 hover:from-blue-700 hover:to-blue-800 text-white font-semibold py-2.5 rounded-lg transition duration-300 shadow-lg hover:shadow-xl flex items-center justify-center"
                >
                    <i class="fas fa-sign-in-alt mr-2"></i>
                    <span id="loginBtnText">登 录</span>
                </button>
            </form>

            <!-- 访客登录 - 简化版 -->
            <div id="guestForm" class="form-tab hidden" data-tab="guest">
                <div class="text-center py-2">
                    <div class="bg-green-50 border border-green-100 rounded-lg p-5 mb-5">
                        <i class="fas fa-user-check text-3xl text-green-500 mb-3 block"></i>
                        <p class="text-gray-700 font-medium mb-1">访客只读模式</p>
                        <p class="text-gray-500 text-sm">可查看餐具、农残、食用油等检测数据，无法新增或修改，病原体检测模块不可见</p>
                    </div>
                    <!-- 错误提示 -->
                    <div id="guestErrorMessage" class="hidden mb-4 p-3 bg-red-100 border border-red-400 text-red-700 rounded-lg text-sm flex items-center">
                        <i class="fas fa-exclamation-circle mr-2"></i>
                        <span id="guestErrorText"></span>
                    </div>
                    <button 
                        type="button" 
                        id="guestEnterBtn"
                        class="w-full bg-gradient-to-r from-green-600 to-green-700 hover:from-green-700 hover:to-green-800 text-white font-semibold py-3 rounded-lg transition duration-300 shadow-lg hover:shadow-xl flex items-center justify-center"
                    >
                        <i class="fas fa-sign-in-alt mr-2"></i>
                        以访客身份进入
                    </button>
                </div>
            </div>

            <!-- 其他登录选项 (预留) -->
            <button type="button" class="w-full py-2 px-4 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50 transition flex items-center justify-center">
                <i class="fas fa-question-circle mr-2"></i>
                需要帮助？
            </button>

            <!-- 底部提示 -->
            <div class="text-center mt-6 text-sm text-gray-600">
                <p>系统版本: 1.0</p>
                <p class="text-xs text-gray-400 mt-2">© 2026 食品安全检验系统. 版权所有</p>
            </div>
        </div>

    </div>

    <script type="module">
        import { authService } from './js/services/AuthService.js';
        import { GuestAuthService } from './js/services/GuestAuthService.js';
        import { extractSchoolCode } from './js/utils/schoolCode.js';

        const guestAuthService = new GuestAuthService();
        const enableGuestEntry = window.__ENABLE_GUEST_ENTRY__ === true;

        // ===== 方案A：按 URL 路径前缀识别学校，登录前完成个性化 =====
        const currentSchoolCode = extractSchoolCode();
        if (currentSchoolCode) {
            applySchoolTheme(currentSchoolCode);
        }

        // 登录前拉取学校个性化配置（Logo / 主题色 / 名称），失败不阻断登录
        async function applySchoolTheme(schoolCode) {
            try {
                const resp = await fetch(`/api/schools/${encodeURIComponent(schoolCode)}/config`);
                if (!resp.ok) return;
                const json = await resp.json();
                const cfg = json && json.data;
                if (!cfg) return;

                if (cfg.name) {
                    document.title = `${cfg.name} - 登录`;
                    const titleEl = document.getElementById('schoolTitle');
                    if (titleEl) titleEl.textContent = cfg.name;
                    const subEl = document.getElementById('schoolSubtitle');
                    if (subEl) subEl.textContent = cfg.shortName || cfg.name;
                }
                // 缓存该校个性化配置，供主应用业务模块按字段渲染（注意：customization 字段为字符串 JSON）
                if (cfg.customization) {
                    try {
                        localStorage.setItem('school_customization_' + schoolCode, JSON.stringify(cfg.customization));
                    } catch (e) { /* 存储不可用时忽略 */ }
                }
                // 同时缓存学校外观信息（name/logoUrl/themeColor），供主页顶部标题动态显示
                try {
                    localStorage.setItem('school_info_' + schoolCode, JSON.stringify({
                        name: cfg.name || '',
                        shortName: cfg.shortName || '',
                        logoUrl: cfg.logoUrl || '',
                        themeColor: cfg.themeColor || '',
                    }));
                } catch (e) { /* 存储不可用时忽略 */ }
                // 预设主题：覆盖 CSS 变量整体换肤（极光壁纸 + 强调色），保留玻璃质感
                const theme = window.SchoolThemes && window.SchoolThemes.resolveTheme(cfg);
                if (theme) {
                    window.SchoolThemes.applyTheme(document, theme);
                    const c = theme.accent;
                    const icon = document.querySelector('.logo-animation i');
                    if (icon) icon.style.color = c;
                    const btn = document.getElementById('loginBtn');
                    if (btn) btn.style.background = `linear-gradient(90deg, ${c}, ${theme.accentStrong || window.SchoolThemes.shade(c, -12)})`;
                }
                if (cfg.logoUrl) {
                    const iconWrap = document.querySelector('.logo-animation');
                    if (iconWrap) {
                        iconWrap.innerHTML = `<img src="${cfg.logoUrl}" alt="logo" class="w-14 h-14 object-contain">`;
                    }
                }
            } catch (e) {
                // 个性化失败不应阻断登录流程
            }
        }

        // 颜色工具已收敛至 window.SchoolThemes.shade（L2：消除 login.html 本地 shadeColor 副本）

        // 若用户已登录（含页面意外重载场景），直接跳转主界面
        if (authService.isAuthenticated()) {
            window.location.replace('./index.html');
        }

        // 每次打开登录页时清除访客 session（访客为临时身份，不自动重登录）
        localStorage.removeItem('guest_token');
        localStorage.removeItem('current_guest');
        
        // ===== 管理员登录表单元素 =====
        const form = document.getElementById('loginForm');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const rememberMeCheckbox = document.getElementById('rememberMe');
        const loginBtn = document.getElementById('loginBtn');
        const loginBtnText = document.getElementById('loginBtnText');
        const errorMessage = document.getElementById('errorMessage');
        
        // ===== Tab 切换逻辑 =====
        const adminTabBtn = document.getElementById('adminTabBtn');
        const guestTabBtn = document.getElementById('guestTabBtn');
        const adminForm = document.getElementById('loginForm');
        const guestForm = document.getElementById('guestForm');

        if (!enableGuestEntry) {
            guestTabBtn.classList.add('hidden');
            guestForm.classList.add('hidden');
            adminTabBtn.classList.remove('flex-1');
            adminTabBtn.classList.add('w-full');
            document.getElementById('loginTabs').classList.remove('border-b');
        }
        
        adminTabBtn.addEventListener('click', () => {
            adminTabBtn.classList.add('border-b-2', 'border-blue-600', 'text-blue-600');
            adminTabBtn.classList.remove('border-transparent', 'text-gray-500');
            
            guestTabBtn.classList.remove('border-b-2', 'border-blue-600', 'text-blue-600');
            guestTabBtn.classList.add('border-transparent', 'text-gray-500');
            
            adminForm.classList.remove('hidden');
            guestForm.classList.add('hidden');
        });
        
        guestTabBtn.addEventListener('click', () => {
            if (!enableGuestEntry) {
                return;
            }
            guestTabBtn.classList.add('border-b-2', 'border-blue-600', 'text-blue-600');
            guestTabBtn.classList.remove('border-transparent', 'text-gray-500');
            
            adminTabBtn.classList.remove('border-b-2', 'border-blue-600', 'text-blue-600');
            adminTabBtn.classList.add('border-transparent', 'text-gray-500');
            
            guestForm.classList.remove('hidden');
            adminForm.classList.add('hidden');
        });

        // 密码可见性切换 (管理员登录)
        const passwordToggleBtnAdmin = document.getElementById('togglePassword');
        if (passwordToggleBtnAdmin) {
            passwordToggleBtnAdmin.addEventListener('click', function() {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                this.innerHTML = type === 'password' 
                    ? '<i class="fas fa-eye"></i>' 
                    : '<i class="fas fa-eye-slash"></i>';
            });
        }

        // 恢复记住的用户名
        window.addEventListener('load', function() {
            const savedUsername = localStorage.getItem('saved_username');
            if (savedUsername) {
                usernameInput.value = savedUsername;
                rememberMeCheckbox.checked = true;
                passwordInput.focus();
            }
        });

        // 管理员表单提交
        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = usernameInput.value.trim();
            const password = passwordInput.value;
            const rememberMe = rememberMeCheckbox.checked;

            // 清除错误提示
            errorMessage.classList.add('hidden');

            // 表单验证
            if (!username || !password) {
                showError('用户名和密码不能为空');
                return;
            }

            // 禁用登录按钮并显示加载状态
            loginBtn.disabled = true;
            loginBtn.classList.add('btn-loading', 'opacity-70');
            loginBtnText.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>登录中...';

            try {
                // 调用 AuthService 登录（携带 schoolCode，供后端路由到对应 schema）
                const result = await authService.login(username, password, currentSchoolCode);

                if (result.success) {
                    // 保存用户名（如果勾选记住我）
                    if (rememberMe) {
                        localStorage.setItem('saved_username', username);
                    } else {
                        localStorage.removeItem('saved_username');
                    }

                    console.log('✅ 登录成功，跳转到主界面...');
                    showError('✅ 登录成功，跳转到主界面...');
                    
                    // 重定向到主应用
                    setTimeout(() => {
                        window.location.replace('./index.html');
                    }, 50);
                } else {
                    const errorMsg = result.message || '登录失败，请检查用户名和密码';
                    console.error('❌ 登录失败:', errorMsg);
                    showError(errorMsg);
                    
                    form.classList.add('error-shake');
                    setTimeout(() => {
                        form.classList.remove('error-shake');
                    }, 300);
                    
                    // 清空密码
                    passwordInput.value = '';
                    passwordInput.focus();
                }
            } catch (error) {
                console.error('❌ 登录错误:', error);
                const errorMsg = error.message || '网络连接失败，请稍后重试';
                showError(errorMsg);
            } finally {
                // 恢复登录按钮
                loginBtn.disabled = false;
                loginBtn.classList.remove('btn-loading', 'opacity-70');
                loginBtnText.innerHTML = '<i class="fas fa-sign-in-alt mr-2"></i>登 录';
            }
        });

        // 显示错误信息
        function showError(message) {
            errorText.textContent = message;
            errorMessage.classList.remove('hidden');
            // 自动隐藏错误提示（5秒后）
            setTimeout(() => {
                errorMessage.classList.add('hidden');
            }, 5000);
        }

        // 按 Enter 提交表单
        form.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                form.dispatchEvent(new Event('submit'));
            }
        });

        // ===== 访客登录 - 简化版 =====
        const guestEnterBtn = document.getElementById('guestEnterBtn');
        const guestErrorMessage = document.getElementById('guestErrorMessage');
        const guestErrorText = document.getElementById('guestErrorText');
        const guestEnterBtnDefaultHtml = guestEnterBtn ? guestEnterBtn.innerHTML : '';

        async function enterAsGuest() {
            if (!enableGuestEntry) {
                return false;
            }
            const ok = await guestAuthService.quickAccessAsViewer();
            if (ok) {
                window.location.href = './index.html';
                return true;
            }
            showError('快速访问失败：请通过学校专属入口（如 /学校代码/login.html）访问，或稍后重试');
            return false;
        }

        if (guestEnterBtn) {
            guestEnterBtn.addEventListener('click', async function() {
                if (!enableGuestEntry) {
                    showError('访客入口已暂时关闭，请使用管理员账号登录');
                    return;
                }
                this.disabled = true;
                this.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>正在进入...';
                const success = await enterAsGuest();
                if (!success) {
                    this.disabled = false;
                    this.innerHTML = guestEnterBtnDefaultHtml;
                }
            });
        }

    </script>
</body>
</html>
